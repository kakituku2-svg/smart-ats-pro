name: AI Seisaku Kobo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai-seisaku-kobo-android/**"
      - "keirin-race-gate/ai-seisaku-kobo/**"
      - ".github/workflows/ai-seisaku-kobo-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare bundled web app
        run: |
          mkdir -p ai-seisaku-kobo-android/app/src/main/assets
          cp keirin-race-gate/ai-seisaku-kobo/index.html ai-seisaku-kobo-android/app/src/main/assets/index.html
          grep -q 'AISeisakuNativeVoice' ai-seisaku-kobo-android/app/src/main/assets/index.html
          grep -q 'v1.2.0' ai-seisaku-kobo-android/app/src/main/assets/index.html
          grep -q 'DEEP PROMPT COMPILER' ai-seisaku-kobo-android/app/src/main/assets/index.html
          grep -q 'REQUIREMENT PRECEDENCE' ai-seisaku-kobo-android/app/src/main/assets/index.html
          grep -q 'ANSWER LEDGER' ai-seisaku-kobo-android/app/src/main/assets/index.html
          grep -q 'LETTERING MAP' ai-seisaku-kobo-android/app/src/main/assets/index.html
          grep -q 'migration/normalize' ai-seisaku-kobo-android/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate native voice source
        run: |
          grep -q 'SpeechRecognizer' ai-seisaku-kobo-android/app/src/main/java/jp/kakituku/aiseisakukobo/MainActivity.java
          grep -q 'RECORD_AUDIO' ai-seisaku-kobo-android/app/src/main/AndroidManifest.xml
          grep -q 'file:///android_asset/index.html' ai-seisaku-kobo-android/app/src/main/java/jp/kakituku/aiseisakukobo/MainActivity.java

      - name: Build APK
        working-directory: ai-seisaku-kobo-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Stage APK
        run: |
          cp ai-seisaku-kobo-android/app/build/outputs/apk/debug/app-debug.apk AI-Seisaku-Kobo-v1.2.0-debug.apk
          sha256sum AI-Seisaku-Kobo-v1.2.0-debug.apk > AI-Seisaku-Kobo-v1.2.0-debug.apk.sha256
          test -s AI-Seisaku-Kobo-v1.2.0-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Seisaku-Kobo-v1.2.0-APK
          path: |
            AI-Seisaku-Kobo-v1.2.0-debug.apk
            AI-Seisaku-Kobo-v1.2.0-debug.apk.sha256
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='ai-seisaku-kobo-v1.2.0'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AI-Seisaku-Kobo-v1.2.0-debug.apk AI-Seisaku-Kobo-v1.2.0-debug.apk.sha256 --clobber
          else
            gh release create "$TAG" AI-Seisaku-Kobo-v1.2.0-debug.apk AI-Seisaku-Kobo-v1.2.0-debug.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title 'AI制作工房 v1.2.0 Deep Prompt Compiler Android APK' \
              --notes 'OUTPUT ROUTERに旧ミニアプリ工房のKnowledge/QA/失敗防止を再統合したDeep Prompt Compiler版。品質MAX/標準/軽量、12成果物専用ENGINE、Androidネイティブ音声認識を搭載。'
          fi
