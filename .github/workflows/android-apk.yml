name: Smart ATS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static product QA
        run: python tools/static_qa.py

      - name: JavaScript syntax checks
        run: |
          for f in core app ai account vault integrations workflow audit onboarding; do
            node --check "android/app/src/main/assets/${f}.js"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SmartATSPro-v0.5.0-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartATSPro-v0.5.0-debug-apk
          path: SmartATSPro-v0.5.0-debug.apk
          if-no-files-found: error
          retention-days: 30
