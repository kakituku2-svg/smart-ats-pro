name: Deploy KEIRIN RACE GATE PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keirin-pwa-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "keirin-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore PWA bundle
        shell: bash
        env:
          SITE_ZIP_B64: >-
            
        run: |
          mkdir -p site
          printf '%s' "$SITE_ZIP_B64" | base64 -d > site.zip
          unzip -q site.zip -d site
          rm -f site/README-iPhone-PWA.txt
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
