name: Deploy KEIRIN RACE GATE PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "keirin-race-gate/**"
      - ".github/workflows/keirin-pwa-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "keirin-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA
        run: |
          test -f keirin-race-gate/index.html
          test -f keirin-race-gate/manifest.webmanifest
          test -f keirin-race-gate/sw.js
          test -f keirin-race-gate/icon.svg
          grep -q "KEIRIN" keirin-race-gate/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./keirin-race-gate

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
