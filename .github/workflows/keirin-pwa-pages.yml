name: Deploy KEIRIN RACE GATE PWA + APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "keirin-race-gate/**"
      - "keirin-android/**"
      - ".github/workflows/keirin-pwa-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "keirin-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA
        run: |
          test -f keirin-race-gate/index.html
          test -f keirin-race-gate/manifest.webmanifest
          test -f keirin-race-gate/sw.js
          test -f keirin-race-gate/icon.svg
          grep -q "KEIRIN" keirin-race-gate/index.html
          grep -q "manifest.webmanifest" keirin-race-gate/index.html
          grep -q "serviceWorker" keirin-race-gate/index.html
          grep -q "v4.3.1" keirin-race-gate/index.html
          grep -q "RACE_STAGE_AND_ADVANCEMENT" keirin-race-gate/index.html
          grep -q "DOUBLE_SECOND_WHEEL" keirin-race-gate/index.html
          ! grep -Eq 'id="generate-button"[^>]*[[:space:]]disabled([[:space:]]|>)' keirin-race-gate/index.html
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path("keirin-race-gate/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)
          assert len(scripts) >= 3, f"expected >=3 scripts, got {len(scripts)}"
          for i, script in enumerate(scripts, 1):
              pathlib.Path(f"/tmp/keirin-script-{i}.js").write_text(script, encoding="utf-8")
          PY
          for f in /tmp/keirin-script-*.js; do node --check "$f"; done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build KEIRIN Android APK
        working-directory: keirin-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Stage direct-download APK
        run: |
          mkdir -p keirin-race-gate/downloads
          cp keirin-android/app/build/outputs/apk/debug/app-debug.apk keirin-race-gate/downloads/KEIRIN-RACE-GATE-v4.3.1.apk
          sha256sum keirin-race-gate/downloads/KEIRIN-RACE-GATE-v4.3.1.apk > keirin-race-gate/downloads/KEIRIN-RACE-GATE-v4.3.1.apk.sha256
          test -s keirin-race-gate/downloads/KEIRIN-RACE-GATE-v4.3.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KEIRIN-RACE-GATE-v4.3.1-APK
          path: keirin-race-gate/downloads/KEIRIN-RACE-GATE-v4.3.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./keirin-race-gate

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published PWA and APK
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --retry-delay 2 "$PAGE_URL" -o /tmp/index.html; then break; fi
            sleep 3
          done
          grep -q "KEIRIN" /tmp/index.html
          grep -q "KEIRIN-RACE-GATE-v4.3.1.apk" /tmp/index.html
          curl -fsSL "${PAGE_URL}manifest.webmanifest" | grep -q "RACE GATE"
          curl -fsSL "${PAGE_URL}sw.js" | grep -q "keirin-race-gate"
          curl -fsSL "${PAGE_URL}downloads/KEIRIN-RACE-GATE-v4.3.1.apk" -o /tmp/keirin.apk
          test -s /tmp/keirin.apk
