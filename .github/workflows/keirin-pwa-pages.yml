name: Deploy KEIRIN RACE GATE PWA + Android Standalone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "keirin-race-gate/**"
      - "keirin-android-standalone/**"
      - ".github/workflows/keirin-pwa-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "keirin-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA source
        run: |
          test -f keirin-race-gate/index.html
          test -f keirin-race-gate/manifest.webmanifest
          test -f keirin-race-gate/sw.js
          test -f keirin-race-gate/icon.svg
          grep -q "v5.7.0" keirin-race-gate/index.html
          grep -q 'src="./tail-risk-v5.js"' keirin-race-gate/index.html
          grep -q "DATA_FRESHNESS_GATE_V57" keirin-race-gate/tail-risk-v5.js
          grep -q "RACE_VALUE_SELECTION_V57" keirin-race-gate/tail-risk-v5.js
          grep -q "HEAD_PLACE_SEPARATION_V57" keirin-race-gate/tail-risk-v5.js
          grep -q "PROBABILITY_PRICE_EV_V57" keirin-race-gate/tail-risk-v5.js
          grep -q "WINTICKET_CARD_AND_COMMENTS" keirin-race-gate/index.html
          grep -q "WINTICKET_CURRENT_ODDS" keirin-race-gate/index.html
          grep -q "FINAL_PRE_RACE_AUDIT" keirin-race-gate/index.html
          grep -q "LINE_SURVIVAL_AUDIT" keirin-race-gate/index.html
          grep -q "AXIS_PAIR_COVERAGE_AUDIT" keirin-race-gate/index.html
          grep -q "LINE_BUNDLE_SURVIVAL_AUDIT" keirin-race-gate/index.html
          grep -q "whole_line_rule" keirin-race-gate/index.html
          grep -q "axis_survivor_pair_rule" keirin-race-gate/index.html
          grep -q "overlooked_place_candidate_rule" keirin-race-gate/index.html
          grep -q "RACE_IDENTITY_LOCK" keirin-race-gate/index.html
          grep -q "RIDER_BACKGROUND_AND_STAKES" keirin-race-gate/index.html
          grep -q "public_evidence_only" keirin-race-gate/index.html
          grep -q "bounded_adjustment" keirin-race-gate/index.html
          grep -q "forbidden_storytelling" keirin-race-gate/index.html
          grep -q "background_application_rule" keirin-race-gate/index.html
          grep -q "head_correct_not_enough_rule" keirin-race-gate/index.html
          grep -q "cross_line_residual_rule" keirin-race-gate/index.html
          grep -q "third_place_tail_rule" keirin-race-gate/index.html
          grep -q "mandatory_trio_retention" keirin-race-gate/index.html
          test -f keirin-race-gate/REGRESSION_CASES.md
          grep -q "いわき平 2R" keirin-race-gate/REGRESSION_CASES.md
          grep -q "2-7-6" keirin-race-gate/REGRESSION_CASES.md
          grep -q "大垣 12R" keirin-race-gate/REGRESSION_CASES.md
          grep -q "3-1-7" keirin-race-gate/REGRESSION_CASES.md
          grep -q "西武園 2R" keirin-race-gate/REGRESSION_CASES.md
          grep -q "4-7-6" keirin-race-gate/REGRESSION_CASES.md
          grep -q "西武園 4R" keirin-race-gate/REGRESSION_CASES.md
          grep -q "5-7-4" keirin-race-gate/REGRESSION_CASES.md
          grep -q "candidate-to-ticket conversion miss" keirin-race-gate/REGRESSION_CASES.md
          grep -q "玉野 7R" keirin-race-gate/REGRESSION_CASES.md
          grep -q "rival line bundle survival miss" keirin-race-gate/REGRESSION_CASES.md
          grep -q "negative_comment_cap" keirin-race-gate/index.html
          grep -q "FIELD_STYLE_COMPOSITION" keirin-race-gate/index.html
          grep -q "SIMILAR_COMPOSITION_HISTORY" keirin-race-gate/index.html
          grep -q "ROLE_FIT_AND_ABILITY_UTILIZATION" keirin-race-gate/index.html
          grep -q "RIDER_BUCKET_CLASSIFICATION" keirin-race-gate/index.html
          grep -q "TOP3_TO_EXACT_ORDER_EXPANSION" keirin-race-gate/index.html
          grep -q "PORTFOLIO_STAKING" keirin-race-gate/index.html
          grep -q "predicted_finish_order_with_vehicle_numbers" keirin-race-gate/index.html
          ! grep -Eq 'id="generate-button"[^>]*[[:space:]]disabled([[:space:]]|>)' keirin-race-gate/index.html
          python3 - <<'PY'
          import re, pathlib
          for src, prefix in [
              ("keirin-race-gate/index.html", "web"),
              ("keirin-android-standalone/app/src/main/assets/index.html", "android")
          ]:
              html = pathlib.Path(src).read_text(encoding="utf-8")
              scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)
              assert len(scripts) >= 3, f"{src}: expected >=3 scripts, got {len(scripts)}"
              for i, script in enumerate(scripts, 1):
                  pathlib.Path(f"/tmp/{prefix}-script-{i}.js").write_text(script, encoding="utf-8")
          PY
          for f in /tmp/web-script-*.js /tmp/android-script-*.js; do node --check "$f"; done
          node --check keirin-race-gate/tail-risk-v5.js
          node --check keirin-android-standalone/app/src/main/assets/tail-risk-v5.js

      - name: Validate Android Standalone source
        run: |
          test -f keirin-android-standalone/app/src/main/assets/index.html
          test -f keirin-android-standalone/app/src/main/java/jp/kakituku/keirinracegate/standalone/MainActivity.java
          grep -q "v5.7.0" keirin-android-standalone/app/src/main/assets/index.html
          test -f keirin-android-standalone/app/src/main/assets/tail-risk-v5.js
          grep -q 'src="./tail-risk-v5.js"' keirin-android-standalone/app/src/main/assets/index.html
          grep -q "PROBABILITY_PRICE_EV_V57" keirin-android-standalone/app/src/main/assets/tail-risk-v5.js
          grep -q "WINTICKET_CARD_AND_COMMENTS" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "WINTICKET_CURRENT_ODDS" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "LINE_SURVIVAL_AUDIT" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "AXIS_PAIR_COVERAGE_AUDIT" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "LINE_BUNDLE_SURVIVAL_AUDIT" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "whole_line_rule" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "axis_survivor_pair_rule" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "overlooked_place_candidate_rule" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "RACE_IDENTITY_LOCK" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "RIDER_BACKGROUND_AND_STAKES" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "public_evidence_only" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "bounded_adjustment" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "forbidden_storytelling" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "background_application_rule" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "head_correct_not_enough_rule" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "cross_line_residual_rule" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "third_place_tail_rule" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "mandatory_trio_retention" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "negative_comment_cap" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "FIELD_STYLE_COMPOSITION" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "ROLE_FIT_AND_ABILITY_UTILIZATION" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "RIDER_BUCKET_CLASSIFICATION" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "TOP3_TO_EXACT_ORDER_EXPANSION" keirin-android-standalone/app/src/main/assets/index.html
          grep -q "PORTFOLIO_STAKING" keirin-android-standalone/app/src/main/assets/index.html
          grep -q 'file:///android_asset/index.html' keirin-android-standalone/app/src/main/java/jp/kakituku/keirinracegate/standalone/MainActivity.java
          grep -q 'addJavascriptInterface' keirin-android-standalone/app/src/main/java/jp/kakituku/keirinracegate/standalone/MainActivity.java
          grep -q 'AndroidBridge' keirin-android-standalone/app/src/main/assets/index.html
          ! grep -q 'uses-permission android:name="android.permission.INTERNET"' keirin-android-standalone/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android Standalone APK
        working-directory: keirin-android-standalone
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Android Hosted Wrapper APK
        working-directory: keirin-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Stage Android Hosted Wrapper APK
        run: |
          mkdir -p keirin-race-gate/downloads
          cp keirin-android/app/build/outputs/apk/debug/app-debug.apk keirin-race-gate/downloads/KEIRIN-RACE-GATE-Android-Hosted-v5.7.0.apk
          sha256sum keirin-race-gate/downloads/KEIRIN-RACE-GATE-Android-Hosted-v5.7.0.apk > keirin-race-gate/downloads/KEIRIN-RACE-GATE-Android-Hosted-v5.7.0.apk.sha256
          test -s keirin-race-gate/downloads/KEIRIN-RACE-GATE-Android-Hosted-v5.7.0.apk

      - name: Stage Android Standalone APK
        run: |
          mkdir -p keirin-race-gate/downloads
          cp keirin-android-standalone/app/build/outputs/apk/debug/app-debug.apk keirin-race-gate/downloads/KEIRIN-RACE-GATE-Android-Standalone-v5.7.0.apk
          sha256sum keirin-race-gate/downloads/KEIRIN-RACE-GATE-Android-Standalone-v5.7.0.apk > keirin-race-gate/downloads/KEIRIN-RACE-GATE-Android-Standalone-v5.7.0.apk.sha256
          test -s keirin-race-gate/downloads/KEIRIN-RACE-GATE-Android-Standalone-v5.7.0.apk

      - name: Upload Android Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: KEIRIN-RACE-GATE-Android-Standalone-v5.7.0-APK
          path: keirin-race-gate/downloads/KEIRIN-RACE-GATE-Android-Standalone-v5.7.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android Hosted Wrapper artifact
        uses: actions/upload-artifact@v4
        with:
          name: KEIRIN-RACE-GATE-Android-Hosted-v5.7.0-APK
          path: keirin-race-gate/downloads/KEIRIN-RACE-GATE-Android-Hosted-v5.7.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./keirin-race-gate

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published PWA and APK
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --retry-delay 2 "$PAGE_URL" -o /tmp/index.html; then break; fi
            sleep 3
          done
          grep -q "v5.7.0" /tmp/index.html
          grep -q "WINTICKET_CARD_AND_COMMENTS" /tmp/index.html
          grep -q "LINE_SURVIVAL_AUDIT" /tmp/index.html
          grep -q "RIDER_BACKGROUND_AND_STAKES" /tmp/index.html
          grep -q "AXIS_PAIR_COVERAGE_AUDIT" /tmp/index.html
          grep -q "KEIRIN-RACE-GATE-Android-Standalone-v5.7.0.apk" /tmp/index.html
          curl -fsSL "${PAGE_URL}manifest.webmanifest" | grep -q "RACE GATE"
          curl -fsSL "${PAGE_URL}sw.js" | grep -q "keirin-race-gate-v5.7.0"
          curl -fsSL "${PAGE_URL}tail-risk-v5.js" | grep -q "PROBABILITY_PRICE_EV_V57"
          curl -fsSL "${PAGE_URL}downloads/KEIRIN-RACE-GATE-Android-Standalone-v5.7.0.apk" -o /tmp/keirin-standalone.apk
          test -s /tmp/keirin-standalone.apk
