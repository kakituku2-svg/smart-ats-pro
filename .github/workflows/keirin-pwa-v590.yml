name: Deploy KEIRIN RACE GATE Premium UI v5.11.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/keirin-pwa-v590.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "keirin-pages-premium-v511"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build v5.11 premium public bundle
        run: |
          set -euo pipefail
          rm -rf _site
          cp -R keirin-race-gate _site
          mkdir -p _site/downloads

          python3 - <<'PY'
          from pathlib import Path
          import re

          RELEASE = '5.11.0'
          REV = '5.11.0-r3'

          CSS_FIX = r'''

/* RELEASE_UI_V511_FIXES — mobile spacing / icon overlap / bottom-nav safe area */
.field::before{grid-column:1!important;grid-row:1/3!important;align-self:start!important;justify-self:start!important}
.field .field-copy{grid-column:2!important;min-width:0!important}
.field input,.field .native-select-wrap{grid-column:2!important;min-width:0!important}
#generate-button{display:grid!important;grid-template-columns:auto minmax(0,1fr) auto!important;align-items:center!important;gap:12px!important;padding:0 18px!important;margin-top:18px!important;margin-bottom:4px!important}
#generate-button::after{content:none!important;display:none!important}
#generate-button .button-icon{display:grid!important;place-items:center!important;width:28px!important;height:28px!important;flex:0 0 auto!important}
#generate-button .button-icon svg,#generate-button .button-arrow{display:block!important;width:22px!important;height:22px!important;fill:none!important;stroke:currentColor!important;stroke-width:1.8!important}
#generate-button>span:not(.button-icon){min-width:0!important;text-align:center!important;white-space:normal!important;line-height:1.35!important}
.round-button[aria-checked="true"]{color:#051421!important;background:linear-gradient(135deg,#66eaff,#37caff)!important;border-color:transparent!important;box-shadow:0 6px 20px rgba(57,223,255,.22)!important}
.field input[type="date"]{padding-right:12px!important}
.field input[type="date"]::-webkit-calendar-picker-indicator{margin-left:8px!important;opacity:.78!important}
.native-select-wrap select{padding-left:16px!important;padding-right:48px!important}
.select-chevron{right:16px!important;z-index:2!important}
main{padding-bottom:calc(132px + env(safe-area-inset-bottom))!important}
footer{padding-bottom:calc(128px + env(safe-area-inset-bottom))!important}
.premium-bottom-nav{bottom:max(10px,env(safe-area-inset-bottom))!important;width:min(520px,calc(100% - 20px))!important}
body.result-open .premium-bottom-nav{opacity:0!important;pointer-events:none!important;transform:translate(-50%,18px)!important}
.paper-badge{white-space:nowrap!important}
@media(max-width:720px){
  .site-header{padding-left:14px!important;padding-right:14px!important}
  .paper-badge{max-width:48vw!important;overflow:hidden!important;text-overflow:ellipsis!important}
  .hero{padding-bottom:24px!important}
  .composer-card{overflow:visible!important}
  .field{grid-template-columns:38px minmax(0,1fr)!important;padding:16px!important}
  .field::before{width:32px!important;height:32px!important}
  .field input,.native-select-wrap select{min-height:52px!important;font-size:16px!important}
  .round-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  #generate-button{min-height:64px!important;padding:0 16px!important;margin-top:20px!important}
  #generate-button .button-arrow{width:20px!important;height:20px!important}
  .premium-bottom-nav{border-radius:18px!important}
}
@media(max-width:380px){
  .brand-copy small{display:none!important}
  .paper-badge{font-size:7px!important;max-width:45vw!important}
  #generate-button{gap:8px!important;padding:0 12px!important;font-size:14px!important}
}
'''

          def patch_premium_css(path):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if 'RELEASE_UI_V511_FIXES' not in s:
                  s += CSS_FIX
              p.write_text(s,encoding='utf-8')

          def patch_premium_js(path):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              s=s.replace("const UI_VERSION = '5.8.0';", "const UI_VERSION = '5.11.0';")
              s=s.replace("const LOGIC_VERSION = '5.10.0';", "const LOGIC_VERSION = '5.11.0';")
              s=s.replace("if(badge) badge.innerHTML='<i></i>v5.8.0 · LIVE DATA / EV';", "if(badge) badge.innerHTML='<i></i>v5.11.0 · HUMAN CONTEXT / EV';")
              old="if(!/AI予想プロンプトを生成/.test(submit.textContent||'')) submit.textContent='AI予想プロンプトを生成';"
              new="const label=[...submit.querySelectorAll('span')].find(x=>!x.classList.contains('button-icon')); if(label){ label.textContent='AI予想プロンプトを生成'; } else if(!/AI予想プロンプトを生成/.test(submit.textContent||'')){ submit.textContent='AI予想プロンプトを生成'; }"
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          def patch_index(path):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              s=s.replace('<!-- KEIRIN AI RACE GATE v5.7.0 iPhone PWA -->','<!-- KEIRIN RACE GATE v5.11.0 Premium PWA -->')
              s=s.replace('<span class="paper-badge"><i></i>v5.7.0 · LIVE DATA / EV</span>','<span class="paper-badge"><i></i>v5.11.0 · HUMAN CONTEXT / EV</span>')
              s=s.replace('<small>v5.7.0 · 20歳以上 / 予想支援ツール</small>','<small>v5.11.0 · DUAL WHEEL / COLLAPSE AUDIT · 20歳以上 / 予想支援ツール</small>')
              s=s.replace('AI予想プロンプト · v5.7.0','AI予想プロンプト · v5.11.0')
              s=s.replace('実戦予想 v5.7.0','実戦予想 v5.11.0')
              s=s.replace('var SPEC_VERSION = "5.7.0";','var SPEC_VERSION = "5.11.0";')
              s=s.replace('"  version: \\"5.7.0\\";",','"  version: \\"5.11.0\\";",')

              css=f'<link rel="stylesheet" href="./premium-ui-v580.css?rev={REV}" />'
              if 'premium-ui-v580.css' not in s:
                  s=s.replace('</head>',css+'\n</head>')
              else:
                  s=re.sub(r'<link rel="stylesheet" href="\./premium-ui-v580\.css[^>]*>',css,s)

              tail='<script src="./tail-risk-v5.js?rev=5.7.0-r3"></script>'
              human=f'<script src="./human-context-v58.js?rev={REV}"></script>'
              premium=f'<script src="./premium-ui-v580.js?rev={REV}"></script>'
              s=re.sub(r'\s*<script src="\./tail-risk-v5\.js[^>]*></script>\s*','\n'+tail+'\n',s)
              s=re.sub(r'\s*<script src="\./human-context-v58\.js[^>]*></script>\s*','\n',s)
              s=re.sub(r'\s*<script src="\./premium-ui-v580\.js[^>]*></script>\s*','\n',s)
              s=s.replace('</body>',human+'\n'+premium+'\n</body>')
              p.write_text(s,encoding='utf-8')

          def write_sw(path):
              Path(path).write_text(r'''// KEIRIN RACE GATE v5.11.0 — direct-asset PWA cache
const CACHE="keirin-race-gate-v5.11.0-r3";
const ASSETS=["./","./index.html","./manifest.webmanifest","./icon.svg","./premium-ui-v580.css?rev=5.11.0-r3","./premium-ui-v580.js?rev=5.11.0-r3","./tail-risk-v5.js?rev=5.7.0-r3","./human-context-v58.js?rev=5.11.0-r3"];
self.addEventListener("install",e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
self.addEventListener("activate",e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
self.addEventListener("fetch",e=>{
  if(e.request.method!=="GET") return;
  const isNav=e.request.mode==="navigate";
  if(isNav){
    e.respondWith(fetch(e.request,{cache:"no-store"}).then(async r=>{const copy=r.clone();const c=await caches.open(CACHE);await c.put(e.request,copy);return r;}).catch(()=>caches.match(e.request).then(r=>r||caches.match("./index.html"))));
    return;
  }
  e.respondWith(fetch(e.request,{cache:"no-store"}).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return r;}).catch(()=>caches.match(e.request)));
});
''',encoding='utf-8')

          patch_premium_css('_site/premium-ui-v580.css')
          patch_premium_js('_site/premium-ui-v580.js')
          patch_index('_site/index.html')
          write_sw('_site/sw.js')

          nested=Path('_site/keirin-race-gate')
          nested.mkdir(parents=True,exist_ok=True)
          for name in ['index.html','manifest.webmanifest','icon.svg','sw.js','tail-risk-v5.js','human-context-v58.js','premium-ui-v580.css','premium-ui-v580.js']:
              src=Path('_site')/name
              if src.exists():
                  (nested/name).write_bytes(src.read_bytes())

          base=Path('_site/index.html').read_text(encoding='utf-8')
          css=Path('_site/premium-ui-v580.css').read_text(encoding='utf-8')
          tail=Path('_site/tail-risk-v5.js').read_text(encoding='utf-8')
          human=Path('_site/human-context-v58.js').read_text(encoding='utf-8')
          premium=Path('_site/premium-ui-v580.js').read_text(encoding='utf-8')
          base=re.sub(r'<link rel="stylesheet" href="\./premium-ui-v580\.css[^>]*>',lambda m:'<style>'+css+'</style>',base)
          base=re.sub(r'<script src="\./tail-risk-v5\.js[^>]*></script>',lambda m:'<script>'+tail+'</script>',base)
          base=re.sub(r'<script src="\./human-context-v58\.js[^>]*></script>',lambda m:'<script>'+human+'</script>',base)
          base=re.sub(r'<script src="\./premium-ui-v580\.js[^>]*></script>',lambda m:'<script>'+premium+'</script>',base)
          base=base.replace('<link rel="manifest" href="./manifest.webmanifest" />','')
          base=base.replace("navigator.serviceWorker.register('./sw.js')","Promise.resolve()")
          Path('_site/downloads/KEIRIN-RACE-GATE-v5.11.0-Standalone.html').write_text(base,encoding='utf-8')
          PY

          cat > _site/404.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEIRIN RACE GATE</title><script>location.replace('/smart-ats-pro/'+location.search+location.hash);</script></head><body></body></html>
          EOF

          grep -q "KEIRIN RACE GATE v5.11.0 Premium PWA" _site/index.html
          grep -q 'premium-ui-v580.css?rev=5.11.0-r3' _site/index.html
          grep -q 'human-context-v58.js?rev=5.11.0-r3' _site/index.html
          grep -q 'premium-ui-v580.js?rev=5.11.0-r3' _site/index.html
          grep -q "RELEASE_UI_V511_FIXES" _site/premium-ui-v580.css
          grep -q "const UI_VERSION = '5.11.0'" _site/premium-ui-v580.js
          grep -q "DUAL_WHEEL_REVERSAL_AUDIT_V511" _site/human-context-v58.js
          grep -q "SELF_AUDIT_LOGIC_V511" _site/human-context-v58.js
          grep -q "COLLAPSE_THIRD_SURVIVOR_AUDIT_V511" _site/human-context-v58.js
          grep -q "TAIL_RISK_THIRD_SURVIVOR_V511" _site/human-context-v58.js
          grep -q "keirin-race-gate-v5.11.0-r3" _site/sw.js
          test -f _site/keirin-race-gate/index.html
          test -s _site/downloads/KEIRIN-RACE-GATE-v5.11.0-Standalone.html
          node --check _site/premium-ui-v580.js
          node --check _site/human-context-v58.js
          node --check _site/tail-risk-v5.js

          test -f _site/ai-seisaku-kobo/index.html
          test -f _site/ai-seisaku-kobo/manifest.webmanifest
          test -f _site/ai-seisaku-kobo/sw.js
          test -f _site/ai-seisaku-kobo/icon-192.png
          test -f _site/ai-seisaku-kobo/icon-512.png
          grep -q "2.5.0-Lite.1" _site/ai-seisaku-kobo/index.html
          grep -q "LITE_MAX_UNITS=5" _site/ai-seisaku-kobo/index.html
          python3 -m json.tool _site/ai-seisaku-kobo/manifest.webmanifest >/dev/null
          node --check _site/ai-seisaku-kobo/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published v5.11 release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --retry-delay 2 "${PAGE_URL}?release=511" -o /tmp/krg-root.html; then break; fi
            sleep 3
          done
          grep -q "v5.11.0 · HUMAN CONTEXT / EV" /tmp/krg-root.html
          grep -q 'premium-ui-v580.css?rev=5.11.0-r3' /tmp/krg-root.html
          grep -q 'human-context-v58.js?rev=5.11.0-r3' /tmp/krg-root.html
          curl -fsSL "${PAGE_URL}keirin-race-gate/?release=511" -o /tmp/krg-nested.html
          grep -q "v5.11.0 · HUMAN CONTEXT / EV" /tmp/krg-nested.html
          curl -fsSL "${PAGE_URL}sw.js?release=511" | grep -q "keirin-race-gate-v5.11.0-r3"
          curl -fsSL "${PAGE_URL}premium-ui-v580.css?rev=5.11.0-r3" | grep -q "RELEASE_UI_V511_FIXES"
          curl -fsSL "${PAGE_URL}human-context-v58.js?rev=5.11.0-r3" | grep -q "DUAL_WHEEL_REVERSAL_AUDIT_V511"
