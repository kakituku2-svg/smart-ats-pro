name: Deploy KEIRIN RACE GATE Premium UI v5.8.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "keirin-race-gate/**"
      - ".github/workflows/keirin-pwa-v590.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "keirin-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build premium public bundle
        run: |
          rm -rf _site
          cp -R keirin-race-gate _site
          mkdir -p _site/downloads

          python3 - <<'PY'
          from pathlib import Path
          import re

          def inject_index(path, prefix='./'):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              s=s.replace('<!-- KEIRIN AI RACE GATE v5.7.0 iPhone PWA -->','<!-- KEIRIN RACE GATE Premium UI v5.8.0 / prediction logic preserved -->')
              css=f'<link rel="stylesheet" href="{prefix}premium-ui-v580.css?rev=5.8.0-r1" />'
              if 'premium-ui-v580.css' not in s:
                  s=s.replace('</head>',css+'\n</head>')
              scripts=[]
              if 'tail-risk-v5.js' not in s:
                  scripts.append(f'<script src="{prefix}tail-risk-v5.js?rev=5.8.0-r1"></script>')
              if 'human-context-v58.js' not in s:
                  scripts.append(f'<script src="{prefix}human-context-v58.js?rev=5.10.0-r1"></script>')
              if 'premium-ui-v580.js' not in s:
                  scripts.append(f'<script src="{prefix}premium-ui-v580.js?rev=5.8.0-r1"></script>')
              if scripts:
                  s=s.replace('</body>','\n'.join(scripts)+'\n</body>')
              p.write_text(s,encoding='utf-8')

          def patch_human_ui(path):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              s=s.replace("if (badge) badge.innerHTML = '<i></i>v5.10.0 · HUMAN CONTEXT / COLLAPSE AUDIT';",
                          "if (badge) badge.innerHTML = '<i></i>v5.8.0 · LIVE DATA / EV';")
              s=s.replace("if (toolbar) toolbar.innerHTML = '<i></i>AI予想プロンプト · v5.10.0';",
                          "if (toolbar) toolbar.innerHTML = '<i></i>AI予想プロンプト · UI v5.8.0 / LOGIC v5.10.0';")
              p.write_text(s,encoding='utf-8')

          inject_index('_site/index.html','./')
          patch_human_ui('_site/human-context-v58.js')

          nested=Path('_site/keirin-race-gate')
          nested.mkdir(parents=True,exist_ok=True)
          for name in ['index.html','manifest.webmanifest','icon.svg','sw.js','tail-risk-v5.js','human-context-v58.js','premium-ui-v580.css','premium-ui-v580.js']:
              src=Path('_site')/name
              if src.exists():
                  (nested/name).write_bytes(src.read_bytes())
          inject_index(nested/'index.html','./')

          base=Path('_site/index.html').read_text(encoding='utf-8')
          css=Path('_site/premium-ui-v580.css').read_text(encoding='utf-8')
          tail=Path('_site/tail-risk-v5.js').read_text(encoding='utf-8')
          human=Path('_site/human-context-v58.js').read_text(encoding='utf-8')
          premium=Path('_site/premium-ui-v580.js').read_text(encoding='utf-8')
          base=re.sub(r'<link rel="stylesheet" href="\./premium-ui-v580\.css[^>]*>', lambda m:'<style>'+css+'</style>', base)
          base=re.sub(r'<script src="\./tail-risk-v5\.js[^>]*></script>', lambda m:'<script>'+tail+'</script>', base)
          base=re.sub(r'<script src="\./human-context-v58\.js[^>]*></script>', lambda m:'<script>'+human+'</script>', base)
          base=re.sub(r'<script src="\./premium-ui-v580\.js[^>]*></script>', lambda m:'<script>'+premium+'</script>', base)
          base=base.replace('<link rel="manifest" href="./manifest.webmanifest" />','')
          base=base.replace("navigator.serviceWorker.register('./sw.js')","Promise.resolve()")
          Path('_site/downloads/KEIRIN-RACE-GATE-v5.8.0-Standalone.html').write_text(base,encoding='utf-8')
          PY

          cat > _site/404.html <<'EOF'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEIRIN RACE GATE</title><script>location.replace('/smart-ats-pro/'+location.search+location.hash);</script></head><body></body></html>
          EOF

          grep -q "premium-ui-v580.css" _site/index.html
          grep -q "premium-ui-v580.js" _site/index.html
          grep -q "v5.8.0 · LIVE DATA / EV" _site/human-context-v58.js
          grep -q "SELF_AUDIT_LOGIC_V510" _site/human-context-v58.js
          grep -q "COLLAPSE_THIRD_SURVIVOR_AUDIT_V510" _site/human-context-v58.js
          grep -q "TAIL_RISK_THIRD_SURVIVOR_V510" _site/human-context-v58.js
          test -f _site/keirin-race-gate/index.html
          test -s _site/downloads/KEIRIN-RACE-GATE-v5.8.0-Standalone.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
