name: Deploy KEIRIN RACE GATE Premium UI v5.13.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/keirin-pwa-v590.yml"
      - ".github/scripts/build_keirin_v511.py"
      - ".github/scripts/build_keirin_v513.py"
      - "keirin-race-gate/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: keirin-pages-premium-v513
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v5.13 Pages bundle
        run: python3 .github/scripts/build_keirin_v513.py

      - name: Validate generated bundle
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/keirin-race-gate/index.html
          test -f _site/sw.js
          test -f _site/keirin-race-gate/sw.js
          test -s _site/downloads/KEIRIN-RACE-GATE-v5.13.0-Standalone.html
          grep -q "v5.13.0" _site/index.html
          grep -q "v5.13.0" _site/keirin-race-gate/index.html
          grep -q "keirin-race-gate-v5.13.0-r2" _site/sw.js
          grep -q "keirin-race-gate-v5.13.0-r2" _site/keirin-race-gate/sw.js
          grep -q "release=513-r2" _site/manifest.webmanifest
          grep -q "COMMENT_HISTORY_MATCH_V513" _site/tail-risk-v5.js
          grep -q "EMOTION_BEHAVIOR_BENEFIT_TRANSFER_V513" _site/tail-risk-v5.js
          grep -q "RECENT_FIVE_RACE_TACTICAL_FORM_V513" _site/tail-risk-v5.js
          grep -q "STYLE_COMPOSITION_COMPATIBILITY_V513" _site/tail-risk-v5.js
          grep -q "MARKET_DISAGREEMENT_AUDIT_V513" _site/tail-risk-v5.js
          grep -q "HEAD_RISE_REBUILD_V513" _site/tail-risk-v5.js
          grep -q "CANDIDATE_TO_COMBINATION_COMPLETENESS_V513" _site/tail-risk-v5.js
          node --check _site/premium-ui-v580.js
          node --check _site/human-context-v58.js
          node --check _site/tail-risk-v5.js
          test -f _site/ai-seisaku-kobo/index.html
          test -f _site/ai-seisaku-kobo/manifest.webmanifest
          test -f _site/ai-seisaku-kobo/sw.js
          test -f _site/ai-seisaku-kobo/app.js
          python3 -m json.tool _site/ai-seisaku-kobo/manifest.webmanifest >/dev/null
          node --check _site/ai-seisaku-kobo/sw.js
          node --check _site/ai-seisaku-kobo/app.js
          grep -q "2.5.0-Lite.3" _site/ai-seisaku-kobo/app.js
          grep -q "LITE_MAX_UNITS=5" _site/ai-seisaku-kobo/app.js
          grep -q 'app.js?v=2.5.0-lite.3' _site/ai-seisaku-kobo/index.html
          ! grep -q "function lpQaRun" _site/ai-seisaku-kobo/index.html
          grep -q "rec.continuous=false" _site/ai-seisaku-kobo/app.js
          grep -q "state.selected.size>=LITE_MAX_UNITS" _site/ai-seisaku-kobo/app.js
          grep -q "ai-seisaku-kobo-lite-v2.5.0-lite.3-pwa4" _site/ai-seisaku-kobo/sw.js
          test -f _site/hall-scope/index.html
          test -f _site/hall-scope/loader-v480.js
          grep -q "HALL SCOPE v4.8" _site/hall-scope/index.html
          grep -q "app-v4.8.part1.txt" _site/hall-scope/loader-v480.js
          grep -q "hall-scope-v4.8.0" _site/hall-scope/sw.js
          node --check _site/hall-scope/loader-v480.js
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          root=Path("_site/hall-scope")
          parts=[root/f"app-v4.8.part{i}.txt" for i in range(1,9)]
          assert all(p.is_file() and p.stat().st_size > 0 for p in parts)
          b64="".join(p.read_text(encoding="utf-8").strip() for p in parts)
          html=gzip.decompress(base64.b64decode(b64)).decode("utf-8")
          assert "HALL_SCOPE_V48_PACHINKO_EVENT_ENGINE" in html
          assert "PACHINKO_EVENT_ENGINE_V48" in html
          assert "EVENT_HANDOFF_MATRIX" in html
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test published v5.13 release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --retry 2 --retry-delay 2 "${PAGE_URL}?release=513-r2" -o /tmp/krg-root.html; then
              break
            fi
            sleep 3
          done
          grep -q "v5.13.0" /tmp/krg-root.html
          curl -fsSL "${PAGE_URL}keirin-race-gate/?release=513-r2" -o /tmp/krg-nested.html
          grep -q "v5.13.0" /tmp/krg-nested.html
          curl -fsSL "${PAGE_URL}sw.js?release=513-r2" -o /tmp/krg-sw.js
          grep -q "keirin-race-gate-v5.13.0-r2" /tmp/krg-sw.js
          curl -fsSL "${PAGE_URL}keirin-race-gate/sw.js?release=513-r2" -o /tmp/krg-nested-sw.js
          grep -q "keirin-race-gate-v5.13.0-r2" /tmp/krg-nested-sw.js
          curl -fsSL "${PAGE_URL}tail-risk-v5.js?release=513-r2" -o /tmp/krg-tail.js
          grep -q "COMMENT_HISTORY_MATCH_V513" /tmp/krg-tail.js
          curl -fsSL "${PAGE_URL}ai-seisaku-kobo/?release=2.5.0-lite.3" -o /tmp/ai-kobo.html
          grep -q 'app.js?v=2.5.0-lite.3' /tmp/ai-kobo.html
          curl -fsSL "${PAGE_URL}hall-scope/?release=480" -o /tmp/hall-scope.html
          grep -q "HALL SCOPE" /tmp/hall-scope.html
          grep -q "v4.8" /tmp/hall-scope.html
          curl -fsSL "${PAGE_URL}hall-scope/loader-v480.js?v=4.8.0" -o /tmp/hall-scope-loader.js
          grep -q "app-v4.8.part1.txt" /tmp/hall-scope-loader.js
          curl -fsSL "${PAGE_URL}hall-scope/app-v4.8.part1.txt?v=4.8.0" -o /tmp/hall-scope-part1.txt
          curl -fsSL "${PAGE_URL}hall-scope/app-v4.8.part8.txt?v=4.8.0" -o /tmp/hall-scope-part8.txt
          test -s /tmp/hall-scope-part1.txt
          test -s /tmp/hall-scope-part8.txt
