name: KEIRIN RACE GATE Real UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "keirin-race-gate/premium-ui-v580.css"
      - "keirin-race-gate/premium-ui-v580.js"
      - "keirin-race-gate/index.html"
      - ".github/workflows/keirin-ui-screenshots.yml"

permissions:
  contents: write

concurrency:
  group: keirin-ui-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare actual app bundle
        run: |
          rm -rf _shot_site
          cp -R keirin-race-gate _shot_site
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_shot_site/index.html')
          s=p.read_text(encoding='utf-8')
          if 'premium-ui-v580.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="./premium-ui-v580.css?rev=5.8.0-r1">\n</head>')
          scripts=[]
          if 'tail-risk-v5.js' not in s: scripts.append('<script src="./tail-risk-v5.js?rev=5.8.0-r1"></script>')
          if 'human-context-v58.js' not in s: scripts.append('<script src="./human-context-v58.js?rev=5.10.0-r1"></script>')
          if 'premium-ui-v580.js' not in s: scripts.append('<script src="./premium-ui-v580.js?rev=5.8.0-r1"></script>')
          if scripts: s=s.replace('</body>','\n'.join(scripts)+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture actual app screens
        run: |
          mkdir -p keirin-race-gate/media
          python3 -m http.server 4173 --directory _shot_site >/tmp/keirin-http.log 2>&1 &
          sleep 2
          cat > /tmp/capture.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            await page.goto('http://127.0.0.1:4173/?capture=1',{waitUntil:'networkidle'});
            await page.screenshot({path:'keirin-race-gate/media/01-top-race-select.png',fullPage:false});
            await page.screenshot({path:'keirin-race-gate/media/05-mobile-full.png',fullPage:true});
            const date=page.locator('input[type="date"]').first();
            if(await date.count()) await date.fill('2026-09-13');
            const select=page.locator('select').first();
            if(await select.count()){
              const opts=await select.locator('option').evaluateAll(os=>os.map(o=>o.value).filter(Boolean));
              if(opts.length) await select.selectOption(opts[0]);
            }
            const round=page.locator('.round-button').first();
            if(await round.count()) await round.click();
            const submit=page.locator('button[type="submit"],#generate-button,.generate-button').first();
            if(await submit.count()) await submit.click();
            await page.waitForTimeout(700);
            const result=page.locator('.result-card').first();
            if(await result.count()){
              await result.scrollIntoViewIfNeeded();
              await page.screenshot({path:'keirin-race-gate/media/02-prompt-generated.png',fullPage:false});
            }
            const features=page.locator('.premium-feature-grid').first();
            if(await features.count()){
              await features.scrollIntoViewIfNeeded();
              await page.screenshot({path:'keirin-race-gate/media/03-analysis-features.png',fullPage:false});
            }
            const out=page.locator('#prompt-output').first();
            if(await out.count()){
              await out.scrollIntoViewIfNeeded();
              await page.screenshot({path:'keirin-race-gate/media/04-ev-buy-skip-prompt.png',fullPage:false});
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/capture.cjs
      - name: Commit real screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keirin-race-gate/media/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add real KEIRIN Race Gate v5.8.0 UI screenshots"
          git push
