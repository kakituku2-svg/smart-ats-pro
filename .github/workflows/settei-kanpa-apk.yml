name: SETTEI KANPA AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "settei-kanpa-ai-android/**"
      - ".github/workflows/settei-kanpa-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build SETTEI KANPA AI
        working-directory: settei-kanpa-ai-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp settei-kanpa-ai-android/app/build/outputs/apk/debug/app-debug.apk SETTEI-KANPA-AI-v4.1.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SETTEI-KANPA-AI-v4.1.0-APK
          path: SETTEI-KANPA-AI-v4.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
