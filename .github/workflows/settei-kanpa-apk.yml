name: HALL SCOPE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "settei-kanpa-ai-android/**"
      - "keirin-race-gate/hall-scope/**"
      - ".github/workflows/settei-kanpa-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 35
        shell: bash
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Stage HALL SCOPE v4.8 bundled app
        shell: bash
        run: |
          mkdir -p settei-kanpa-ai-android/app/src/main/assets
          rm -f settei-kanpa-ai-android/app/src/main/assets/app-v4.*.txt settei-kanpa-ai-android/app/src/main/assets/app-v4.*.b64
          cp keirin-race-gate/hall-scope/app-v4.8.part*.txt settei-kanpa-ai-android/app/src/main/assets/
          test "$(ls settei-kanpa-ai-android/app/src/main/assets/app-v4.8.part*.txt | wc -l)" -eq 8
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build HALL SCOPE
        working-directory: settei-kanpa-ai-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Stage APK
        run: cp settei-kanpa-ai-android/app/build/outputs/apk/debug/app-debug.apk HALL-SCOPE-v4.8.0-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HALL-SCOPE-v4.8.0-APK
          path: HALL-SCOPE-v4.8.0-debug.apk
          if-no-files-found: error
          retention-days: 30
