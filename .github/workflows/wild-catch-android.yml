name: WILD CATCH v0.5.0 Android APK

on:
  push:
    branches: ["wild-catch-build"]
    paths:
      - "wild-catch/**"
      - ".github/workflows/wild-catch-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wild-catch-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public build snapshot
        uses: actions/checkout@v4

      - name: Static project QA
        run: |
          python wild-catch/tools/static_qa.py
          python wild-catch/tools/art_static_qa.py
          python wild-catch/tools/mission_art_manifest_qa.py
          python wild-catch/tools/ui_static_qa.py
          python wild-catch/tools/performance_budget_qa.py
          python wild-catch/tools/mission_static_qa.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot 4.7.2
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Install Godot Android export templates
        run: |
          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -O templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/android_debug.apk"

      - name: Import Godot project
        run: timeout 60s ./godot --headless --path wild-catch --editor --quit-after 5

      - name: Parse and boot main scene
        run: timeout 60s ./godot --headless --path wild-catch --quit-after 20

      - name: Runtime smoke tests
        run: |
          timeout 90s ./godot --headless --path wild-catch res://tools/runtime_smoke.tscn
          timeout 90s ./godot --headless --path wild-catch res://tools/runtime_mobile_input_smoke.tscn
          timeout 90s ./godot --headless --path wild-catch res://tools/runtime_mission_flow_smoke.tscn

      - name: Export Android debug APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          mkdir -p wild-catch/build
          timeout 180s ./godot --headless --path wild-catch --export-debug "Android Debug" build/WILD_CATCH_v0.5.0_debug.apk
          test -s wild-catch/build/WILD_CATCH_v0.5.0_debug.apk
          unzip -t wild-catch/build/WILD_CATCH_v0.5.0_debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WILD_CATCH_v0.5.0_debug_apk
          path: wild-catch/build/WILD_CATCH_v0.5.0_debug.apk
          if-no-files-found: error
          retention-days: 30
