plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('SMART_ATS_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('SMART_ATS_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('SMART_ATS_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SMART_ATS_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'jp.smartats.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.smartats.pro'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.register('verifyReleaseSigningEnvironment') {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing secrets are not configured. Set SMART_ATS_KEYSTORE_PATH, SMART_ATS_KEYSTORE_PASSWORD, SMART_ATS_KEY_ALIAS, SMART_ATS_KEY_PASSWORD.')
        }
    }
}
