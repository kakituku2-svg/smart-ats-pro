<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="color-scheme" content="light" />
  <title>Smart ATS Pro</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="ai.css" />
  <link rel="stylesheet" href="account.css" />
  <link rel="stylesheet" href="vault.css" />
  <link rel="stylesheet" href="workflow.css" />
  <link rel="stylesheet" href="audit.css" />
  <link rel="stylesheet" href="onboarding.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">SMART ATS PRO · LOCAL FIRST + GEMINI</div>
        <h1 id="screenTitle">ホーム</h1>
      </div>
      <div class="top-actions">
        <button class="ai-hub-btn" id="aiHubBtn" aria-label="AIアシストを開く">AI</button>
        <button class="icon-btn" id="globalAddBtn" aria-label="新規追加">＋</button>
      </div>
    </header>

    <main id="appMain" class="main"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-item active" data-screen="home"><span>⌂</span><small>ホーム</small></button>
      <button class="nav-item" data-screen="candidates"><span>人</span><small>候補者</small></button>
      <button class="nav-item" data-screen="jobs"><span>▣</span><small>求人</small></button>
      <button class="nav-item" data-screen="pipeline"><span>⇢</span><small>選考</small></button>
      <button class="nav-item" data-screen="more"><span>•••</span><small>その他</small></button>
    </nav>
  </div>

  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <section class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div>
        <div class="eyebrow" id="sheetEyebrow">編集</div>
        <h2 id="sheetTitle">データ</h2>
      </div>
      <button class="icon-btn ghost" id="sheetCloseBtn" aria-label="閉じる">×</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <template id="candidateFormTemplate">
    <form class="form-stack" id="candidateForm" novalidate>
      <input type="hidden" name="id" />
      <label>氏名 <span class="required">必須</span><input name="name" required maxlength="60" autocomplete="off" placeholder="例：山田 太郎" /></label>
      <div class="form-grid two">
        <label>応募求人<select name="jobId" id="candidateJobSelect"></select></label>
        <label>ステータス<select name="status" id="candidateStatusSelect"></select></label>
      </div>
      <div class="form-grid two">
        <label>応募経路<select name="source"><option>エン転職</option><option>マイナビ転職</option><option>リクナビNEXT</option><option>doda</option><option>Indeed</option><option>紹介</option><option>自社採用</option><option>その他</option></select></label>
        <label>担当者<input name="owner" maxlength="60" placeholder="例：採用担当A" /></label>
      </div>
      <div class="form-grid two">
        <label>次回対応日<input type="date" name="nextActionDate" /></label>
        <label>次回対応<input name="nextAction" maxlength="100" placeholder="例：面接日程を確認" /></label>
      </div>
      <div class="form-grid two">
        <label>メール<input type="email" name="email" maxlength="120" inputmode="email" /></label>
        <label>電話<input type="tel" name="phone" maxlength="30" inputmode="tel" /></label>
      </div>
      <label>希望条件・プロフィール<textarea name="desired" rows="3" maxlength="1200" placeholder="希望条件、転職軸、入社可能時期など"></textarea></label>
      <label>履歴書・職務経歴書の要約<textarea name="resumeSummary" rows="4" maxlength="2400" placeholder="経歴の要点を記録"></textarea></label>
      <div class="form-grid two">
        <label>スキル一致<input name="skillsMatched" maxlength="500" placeholder="例：店舗運営, マネジメント" /></label>
        <label>確認したい不足・懸念<input name="skillsMissing" maxlength="500" placeholder="例：予算管理の経験" /></label>
      </div>
      <div class="score-fieldset">
        <div class="field-title">ATS参考スコア <span class="tiny-note">自動合否には使用しません</span></div>
        <div class="form-grid score-grid">
          <label>参考値 0〜100<input type="number" name="atsScore" min="0" max="100" step="1" inputmode="numeric" /></label>
          <label>根拠メモ<input name="atsNote" maxlength="300" placeholder="求人要件との一致点など" /></label>
        </div>
      </div>
      <label>採用担当メモ<textarea name="notes" rows="5" maxlength="2400" placeholder="面談内容、懸念点、次の確認事項など"></textarea></label>
      <div class="form-actions sticky-actions">
        <button type="button" class="danger-text hidden" id="deleteCandidateBtn">削除</button>
        <button type="submit" class="primary-btn">保存</button>
      </div>
    </form>
  </template>

  <template id="jobFormTemplate">
    <form class="form-stack" id="jobForm" novalidate>
      <input type="hidden" name="id" />
      <label>求人名 <span class="required">必須</span><input name="title" required maxlength="100" placeholder="例：施設運営マネージャー" /></label>
      <div class="form-grid two">
        <label>部署<input name="department" maxlength="80" placeholder="例：運営事業部" /></label>
        <label>採用責任者<input name="hiringManager" maxlength="80" placeholder="例：運営部長" /></label>
      </div>
      <div class="form-grid two">
        <label>勤務地<input name="location" maxlength="80" placeholder="例：東京都" /></label>
        <label>雇用形態<select name="employment"><option>正社員</option><option>契約社員</option><option>アルバイト</option><option>業務委託</option></select></label>
      </div>
      <div class="form-grid two">
        <label>採用予定人数<input type="number" name="openings" min="1" max="999" value="1" inputmode="numeric" /></label>
        <label>求人状態<select name="state"><option>募集中</option><option>一時停止</option><option>終了</option></select></label>
      </div>
      <label>想定年収<input name="salary" maxlength="80" placeholder="例：450〜600万円" /></label>
      <label>必須要件<textarea name="requirements" rows="4" maxlength="1800" placeholder="必須経験・資格・条件"></textarea></label>
      <label>歓迎要件<textarea name="preferred" rows="3" maxlength="1400" placeholder="歓迎経験・人物像"></textarea></label>
      <label>求人メモ<textarea name="notes" rows="4" maxlength="1800"></textarea></label>
      <div class="form-actions sticky-actions">
        <button type="button" class="danger-text hidden" id="deleteJobBtn">削除</button>
        <button type="submit" class="primary-btn">保存</button>
      </div>
    </form>
  </template>

  <template id="interviewFormTemplate">
    <form class="form-stack" id="interviewForm" novalidate>
      <label>面接日<input type="date" name="date" required /></label>
      <div class="form-grid two">
        <label>面接種別<select name="type"><option>カジュアル面談</option><option>一次面接</option><option>二次面接</option><option>最終面接</option><option>条件面談</option><option>その他</option></select></label>
        <label>面接官<input name="interviewer" maxlength="80" placeholder="例：採用担当A" /></label>
      </div>
      <div class="form-grid two">
        <label>評価 1〜5<select name="rating"><option value="">未評価</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select></label>
        <label>推奨<select name="recommendation"><option>保留</option><option>次へ進めたい</option><option>追加確認</option><option>見送り候補</option></select></label>
      </div>
      <label>評価メモ<textarea name="notes" rows="5" maxlength="1800" placeholder="事実・回答内容・次回確認事項を記録"></textarea></label>
      <p class="safety-note">評価は面接内容と職務要件に基づく参考記録です。センシティブな属性を合否根拠として記録しないでください。</p>
      <div class="form-actions"><button type="submit" class="primary-btn">面接評価を保存</button></div>
    </form>
  </template>

  <div class="ai-backdrop hidden" id="aiBackdrop"></div>
  <section class="ai-panel hidden" id="aiPanel" role="dialog" aria-modal="true" aria-labelledby="aiTitle">
    <header class="ai-panel-head">
      <div><div class="eyebrow">GEMINI ASSIST</div><h2 id="aiTitle">AIアシスト</h2></div>
      <button class="icon-btn ghost" id="aiCloseBtn" aria-label="AIアシストを閉じる">×</button>
    </header>
    <div id="aiBody" class="ai-body"></div>
  </section>

  <script src="core.js"></script>
  <script src="app.js"></script>
  <script src="ai.js"></script>
  <script src="account.js"></script>
  <script src="vault.js"></script>
  <script src="integrations.js"></script>
  <script src="workflow.js"></script>
  <script src="audit.js"></script>
  <script src="onboarding.js"></script>
</body>
</html>
