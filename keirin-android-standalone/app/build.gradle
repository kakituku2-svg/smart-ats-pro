plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.kakituku.keirinracegate.standalone'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.kakituku.keirinracegate.standalone'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '4.4.0-standalone'
    }

    buildTypes {
        debug {
            debuggable false
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
