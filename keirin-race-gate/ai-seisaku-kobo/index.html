<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>AI制作工房 v1.2.0</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden}body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#080d1c;color:#f6f8ff}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;height:60px;padding:0 16px;display:flex;align-items:center;background:#080d1cf5;border-bottom:1px solid #ffffff18}.brand{font-weight:900}.brand small{display:block;font-size:9px;color:#8ca1c8}.wrap{width:min(1040px,calc(100% - 28px));margin:auto}.hero{padding:36px 0 22px}.hero h1{font-size:clamp(34px,7vw,58px);line-height:1.06;margin:10px 0}.hero h1 span{color:#78cfff}.hero p,.muted{color:#aab6d0;line-height:1.65}.card{background:#0f172c;border:1px solid #ffffff18;border-radius:18px;padding:18px;margin:14px 0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fields label{font-size:12px;color:#c9d2e7}.fields label.full{grid-column:1/-1}.fields input,.fields textarea,.fields select{width:100%;margin-top:5px;background:#091126;border:1px solid #ffffff1f;border-radius:11px;color:#fff;padding:11px;min-height:44px}.fields textarea{min-height:92px;resize:vertical}.voicewrap{position:relative}.voicewrap textarea{padding-right:48px}.mic{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border:1px solid #ffffff20;border-radius:9px;background:#15223e;color:#ff7b9a}.primary,.secondary{border:0;border-radius:11px;padding:12px 15px;font-weight:850}.primary{background:linear-gradient(90deg,#198eea,#675fe8);color:white}.secondary{background:#17213a;color:#fff;border:1px solid #ffffff18}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.outs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.out{position:relative;border:1px solid #ffffff18;background:#0c1427;border-radius:14px;padding:14px;min-height:118px}.out.on{border-color:#66c8ff;background:#10213a}.out b{display:block;margin:4px 0}.out small{color:#98a8c8}.out .check{position:absolute;right:10px;top:10px}.pack{white-space:pre-wrap;overflow-wrap:anywhere;background:#07101f;border:1px solid #ffffff18;border-radius:12px;padding:14px;font-size:12px;line-height:1.55;max-height:420px;overflow:auto}.promptCard{margin-top:12px}.promptHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.promptHead h3{margin:0}.badge{font-size:10px;padding:5px 8px;border:1px solid #ffffff20;border-radius:999px;color:#a9b7d0}.voice{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(500px,calc(100% - 24px));z-index:30;display:flex;gap:10px;align-items:center;background:#0d1830;border:1px solid #5bc7ff55;border-radius:13px;padding:11px}.voice[hidden]{display:none}.voice div{flex:1;min-width:0}.voice p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0;color:#b9c7df}.toast{position:fixed;right:14px;bottom:14px;background:#15213a;border:1px solid #ffffff22;border-radius:10px;padding:10px;z-index:40}.toast[hidden]{display:none}@media(max-width:760px){.fields{grid-template-columns:1fr}.outs{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:26px}}@media(max-width:470px){.outs{grid-template-columns:1fr}.wrap{width:calc(100% - 20px)}.card{padding:14px}.voice{bottom:10px}}
</style></head><body><header class="top"><div class="brand">✦ AI制作工房<small>v1.2.0 DEEP PROMPT COMPILER</small></div></header><main class="wrap"><section class="hero"><span class="badge">ROUTER × OLD KOBO KNOWLEDGE</span><h1>やりたいことから、<br><span>強い制作指示まで。</span></h1><p>旧ミニアプリ工房のKnowledge / QA / 失敗防止を、成果物専用ENGINEとして再構成。目的→成果物→実制作プロンプトを一気に作ります。</p></section><section class="card"><div class="fields"><label class="full">やりたいこと<div class="voicewrap"><textarea id="goal" placeholder="例：新商品のPRをしたい。LPとSNS画像と営業資料までまとめて作りたい。"></textarea><button class="mic" data-voice="goal">●</button></div></label><label>誰に届けたい？<input id="aud" placeholder="未指定でもOK"></label><label>最終ゴール<select id="purpose"><option value="auto">AIに任せる</option><option value="sell">売る・集客</option><option value="explain">伝える</option><option value="operate">業務改善</option><option value="teach">教える</option><option value="entertain">楽しませる</option><option value="research">調べて判断</option></select></label><label>品質<select id="quality"><option value="max">品質MAX（推奨・省略しない）</option><option value="standard">標準（十分詳しい）</option><option value="light">軽量（短め）</option></select></label><label>雰囲気<input id="mood" placeholder="例：信頼感・洗練"></label><label>ブランド / 商品名<input id="brand"></label><label class="full">必ず守ること<div class="voicewrap"><textarea id="must"></textarea><button class="mic" data-voice="must">●</button></div></label></div><div class="actions"><button id="route" class="primary">OUTPUT ROUTERを実行</button><button id="clear" class="secondary">クリア</button></div></section><section id="results" class="card" hidden><div class="promptHead"><div><span class="badge" id="resolved">分析済み</span><h2>必要な成果物を選ぶ</h2></div><b id="count">0個</b></div><div id="outs" class="outs"></div><div class="actions"><button id="build" class="primary">Deep Production Packを生成 →</button></div></section><section id="packSec" class="card" hidden><div class="promptHead"><div><span class="badge">PRODUCTION PACK</span><h2>成果物専用Deep Prompt</h2></div><button id="allcopy" class="secondary">全部コピー</button></div><div id="pack"></div></section></main><div id="voice" class="voice" hidden><span>●</span><div><b>音声入力中</b><small id="time">00:00</small><p id="preview">話してください…</p></div><button id="stop" class="secondary">停止</button></div><div id="toast" class="toast" hidden></div><script>
(()=>{'use strict';const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];const V='1.2.0';const OUT={app:['▣','ミニアプリ','Sites / Code'],site:['◫','Webサイト / LP','Sites'],visual:['▧','PR画像 / 図解','Images'],slides:['▤','スライド / 提案資料','Work'],document:['▥','文書 / レポート','Work'],sheet:['▦','表計算 / 管理表','Work'],sns:['◉','SNS投稿セット','ChatGPT + Images'],manga:['◇','漫画 / Webtoon','ChatGPT + Images'],education:['△','教材 / ドリル','ChatGPT + Images'],research:['⌕','リサーチ / 分析','Web / Work'],automation:['⟳','自動化設計','Tasks / Plugins'],manual:['?','マニュアル / ガイド','Work / Images']};let sel=new Set(),rtype='explain';const val=id=>$(id).value.trim(),toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,1700)};
const SIG={app:['アプリ','業務','入力','保存','検索','予約','管理'],site:['サイト','web','lp','販売','集客','採用','店舗','商品'],visual:['画像','広告','図解','ポスター','バナー','チラシ','メニュー'],slides:['資料','営業','提案','プレゼン','研修','説明会'],document:['文書','レポート','企画書','記事','報告書'],sheet:['excel','表','売上','予算','在庫','kpi','集計','シフト'],sns:['sns','instagram','x','tiktok','投稿','バズ','拡散'],manga:['漫画','webtoon','マンガ','ストーリー','キャラ'],education:['教材','学習','ドリル','問題集','小学生','中学生','算数','数学','理科'],research:['調査','市場','競合','比較','分析','検証','最新'],automation:['自動','毎日','毎週','通知','監視','slack','github','メール'],manual:['マニュアル','手順','使い方','ガイド','説明書']};
function infer(t){const R={sell:['売','集客','宣伝','広告','販売','来店','採用','申込'],operate:['業務','管理','記録','自動','社内','現場'],teach:['教材','学習','教え','ドリル','問題集'],entertain:['漫画','物語','webtoon','楽し'],research:['調査','比較','市場','分析','検証']};let b='explain',n=0;for(const[k,a]of Object.entries(R)){let s=a.filter(x=>t.includes(x)).length;if(s>n){n=s;b=k}}return b}
function route(){const t=(val('#goal')+' '+val('#aud')+' '+val('#must')).toLowerCase();if(!t.trim())return toast('やりたいことを入力してください');rtype=$('#purpose').value==='auto'?infer(t):$('#purpose').value;let scores={};for(const[k,a]of Object.entries(SIG)){scores[k]=a.reduce((n,x)=>n+(t.includes(x)?3:0),1)}const boost={sell:['site','visual','sns','slides'],operate:['app','sheet','automation','manual'],teach:['education','visual','slides'],research:['research','sheet','slides','document'],entertain:['manga','visual','sns'],explain:['document','slides','visual','site']}[rtype]||[];boost.forEach(k=>scores[k]+=5);const arr=Object.entries(scores).sort((a,b)=>b[1]-a[1]);sel=new Set(arr.slice(0,4).map(x=>x[0]));$('#resolved').textContent='分析済み：'+rtype;$('#outs').innerHTML=arr.slice(0,10).map(([k,s])=>card(k,s)).join('');$('#results').hidden=false;bindCards();updateCount()}
function card(k,s){const o=OUT[k],on=sel.has(k);return `<article class="out ${on?'on':''}" data-k="${k}"><span class="check">${on?'✓':'＋'}</span><span>${o[0]}</span><b>${o[1]}</b><small>${o[2]} / 適合${Math.min(99,52+s*5)}%</small></article>`}function bindCards(){$$('.out').forEach(c=>c.onclick=()=>{let k=c.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);c.classList.toggle('on',sel.has(k));$('.check',c).textContent=sel.has(k)?'✓':'＋';updateCount()})}function updateCount(){$('#count').textContent=sel.size+'個'}
function master(){return `# MASTER BRIEF — AI制作工房 v${V}\n目的：${val('#goal')}\n想定対象：${val('#aud')||'未指定。安全な仮定で補完し、仮定と明示'}\n最終ゴール：${rtype}\nブランド/商品名：${val('#brand')||'未指定'}\n雰囲気：${val('#mood')||'目的に合わせて提案'}\n必須条件：${val('#must')||'特になし'}\n\n# REQUIREMENT PRECEDENCE — NEVER REORDER\n1. ユーザー明示条件 2. 今回の成果物/納品条件 3. 提供素材/既存仕様 4. 成果物専用ENGINEのMUST 5. 推奨改善。下位ルールで上位条件を勝手に狭めない。\n\n# FACT / ASSUMPTION BOUNDARY\n固有名詞・価格・統計・制度・日付・仕様・引用・出典を未確認の事実として創作しない。現在性が必要なら利用可能な検索/接続で確認し、できなければ要確認。レイアウトや仮コピーなど創作補完可能部分は仮案として進める。\n\n# EXECUTION DISCIPLINE\nアイデア列挙で止まらず、可能な環境では実制作・編集・ファイル生成まで進む。TODO/以下略/ダミーを完成扱いしない。実行していない検索・テスト・保存・公開・外部連携を成功と書かない。`;}
const GLOBAL=`# KNOWLEDGE REUSE / FAILURE PREVENTION\n旧ミニアプリ工房で蓄積した成功/失敗パターンを今回の成果物に必要な範囲で適用する。単に知識を列挙せず、設計・制作・QAへ埋め込む。ユーザー指定にない機能をKnowledge由来で増やさない。\n\n# RESPONSIVE / DEVICE CONTRACT\nWeb系はDesktop/Tablet/390pxスマホで横スクロール・重なり・画面外はみ出しを禁止。tap target、safe-area、長文折返しを確認。Clipboard/Speech/Camera/Notification等はfeature detectionし、Android WebView/PWA/ブラウザ差を吸収。実機未確認なら DEVICE_NOT_VERIFIED と明記しPASS扱いしない。\n\n# QA CONTRACT\n完成前に critical path、empty/invalid/success/error、境界値、長文、スマホ表示、再読込、失敗時復旧を確認。CHECKED / NOT_VERIFIABLE / FAILを区別。FAILが残る場合は修正して再確認。\n\n# DELIVERY CONTRACT\n説明だけで終わらず、利用環境で作成可能なら完成ファイル/画像/サイト/表/資料を優先して納品。生成不能な部分は、次工程へそのまま投入できる完全指示として残す。`;
const VIS=`# VISUAL ARTIFACT MASTER POLICY\n主成果物が視覚制作物なら完成ビジュアルを主成果物とする。1ページ/1投稿/1スライド=1枚の独立成果物。4ページ制作は4枚でありコラージュではない。PDF/DOCX/PPTXの低品質レイアウトを画像完成品の代替にしない。制作前にDESIGN BIBLE（見出し階層、本文階層、配色役割、余白、画材感、角丸/線/影、写真/人物扱い）を固定。1ページ1メッセージ、視覚的主役を1つ。白背景＋同サイズカードの反復、意味のないグラデーション/浮遊丸/過剰影を避ける。画像文字は正確な本文マスターを保持し、崩れたら文字入れ工程で修正。`;
const E={app:`# APP COMPLETION ENGINE\nあなたはシニアプロダクトデザイナー/フロントエンド/QA。見た目だけでなく実利用可能なアプリを完成させる。\nMUST: 主要ユーザーフロー→画面→状態→データ→イベント→保存→復元→失敗時の順に設計。内部record IDを表示名と分離。保存は save→read-back→再起動load を確認。schemaVersionを持ち migration/normalize で旧/欠損/破損データを復旧。JSONバックアップ/復元を設計。1000件規模の一覧でも全再描画や重い同期処理を避ける。selector/フィルタ/集計の同期を確認。localStorage/IndexedDB/ファイルAPIは例外処理。\n端末APIはClipboard/Speech/Camera/File/Share等をfeature detectionし、Web/PWA/WebView/Nativeのフォールバックを持つ。外部サービス/API/OS権限を実装していないのに「連携済み」と見せない。\nUIは390pxでbody横スクロールなし、重要tap 44px目安、fixed/stickyの重なりなし。PC版を単純縮小せず情報密度を再設計。\nQA: create/edit/delete/search/filter/save/read-back/reload/migration/corrupt-data/empty/invalid/duplicate/long-text/offline-or-failureを確認。`,site:`# SITE / LP ENGINE\n訪問者の3秒理解→信頼→比較/納得→CTAの順で情報設計。Heroは「誰の何をどう変えるか」を具体化。ファーストビューで主CTAを1つ明確化し、同格CTA乱立を避ける。セクション順は目的に合わせて課題/価値/仕組み/証拠/比較/FAQ/CTAを再構成。スマホで文字を縮小しすぎず、固定要素がCTAを隠さない。公開先が使えるなら実サイトまで作成。存在しない実績/レビュー/導入社/数字を創作しない。`,visual:`# COMMERCIAL VISUAL ENGINE\n完成前にDESIGN BIBLEを固定。広告なら訴求→主役→補助→CTA、図解なら見出し→結論→根拠/流れを3秒で把握可能にする。素材不足を装飾で埋めない。同じカードテンプレの焼き直しを避け、ヒーロー/左右分割/比較/フロー/タイムライン/注釈一枚絵等から内容に合う型を選ぶ。文字化け・意味不明英数字を禁止し、本文マスターと照合して修正。`,slides:`# PRESENTATION ENGINE\n最初に目的/聴衆/意思決定を固定し、1スライド1メッセージ。タイトルは内容ラベルではなく結論型を優先。導入→課題→根拠→提案→実行→次アクションを目的に合わせ再構成。文章を小さく詰めず、削る/図にする/分ける/強弱の順で解決。図表は主張と一致。ページ間でデザインシステムを統一しながら構図を機械反復しない。`,document:`# DOCUMENT ENGINE\n読み手/用途/意思決定点を先に固定。見出し階層、要約、本文、表/注記の役割を明確にする。根拠と提案と仮定を混同しない。長文は結論→根拠→詳細。既存文書編集ならユーザーが指定していない構造変更・意味変更を避ける。完成文書を作れる環境なら編集可能な成果物まで作成。`,sheet:`# SPREADSHEET ENGINE\n入力/計算/出力を分離。セル直書きのマジックナンバーを減らし、計算根拠を追跡可能にする。数式は代表行だけでなく先頭/中間/末尾と境界値を再計算。日付/率/通貨/単位を統一。空白/0/負数/重複/欠損を確認。グラフは意思決定に必要なものだけ。サンプル値を実績と誤認させない。`,sns:`# SNS CONTENT ENGINE\n媒体ごとの表示単位を守り、1投稿1メッセージ。Hook→価値→具体→CTA。カルーセルは1枚目で読む理由、途中は論理の連続、最終は行動。全媒体に同じ文章をコピペせず、内容の核とブランドは統一。実績/人気/口コミを創作しない。画像投稿はVisual Artifactを適用。`,manga:`# MANGA / WEBTOON ENGINE\n日本式右綴じ漫画とWebtoonを別ENGINEとして扱う。右綴じは右→左の視線、見開き、奇偶ページ、ページめくり、引きを設計。Webtoonは上→下、スマホ幅、縦余白、スクロール速度、間、クリフハンガーを設計し見開き概念を持ち込まない。CHARACTER/LOCATION/PROP BIBLEを固定。DIALOGUE VOICE BIBLEとLETTERING MAP（吹き出しID、話者、正確な文、読順、位置、尾先、縦横、強調）を持つ。会話/叫び/思考/ナレーション/SFXを分離。日本語文字が画像生成で崩れるなら絵＋空吹き出し→正確な文字入れで修正。`,education:`# EDUCATION QUALITY / ANSWER VERIFICATION ENGINE\n学年/教科/単元/目的を中心に語彙と既習範囲を合わせる。制作前にANSWER LEDGER（Q-ID/正答/途中式・根拠/単位/採点観点/検算状態）を作り全問PASS後に教材化。Q1↔A1を完全1:1とし、設問数=解答数。算数/数学/物理/化学は元答えを写さず独立再計算し、符号/桁/単位/座標/丸め条件を照合。問題面に答えを漏らさず、指定が巻末解答なら必ず独立した解答解説面を作る。全問に必要な主要途中式/理由。誤答パターン1〜3個と「なぜ」を短く示す。画像文字が壊れても正答を失わないよう正答マスターをテキスト保持。`,research:`# RESEARCH ENGINE\n事実/推測/仮説を分離。現在性が必要ならWeb等で確認し、発生日と記事公開日を区別。一次情報/公式を優先し、比較では条件/母数/期間を揃える。検索していないのに調査済みと書かない。最終出力は情報列挙で終わらず、論点→比較→示唆→意思決定へ変換。`,automation:`# AUTOMATION ENGINE\ntrigger→input→condition→action→notification→failure/retryを明記。時刻/条件/頻度を曖昧にしない。外部アプリの接続・権限・Webhook等が確認できない場合は実行済みにしない。重複通知、無限再試行、同一イベント二重処理、停止条件を設計。`,manual:`# MANUAL ENGINE\n読者の前提レベルと到達状態を定義。1手順1操作、操作→期待結果→失敗時対処をセット化。画面名/ボタン名を実UIと一致させる。スクリーンショットが必要なら実画面を使い、架空UIを実画面として扱わない。FAQは実際につまずく分岐から作る。`};
const PROD={app:'画面一覧/状態遷移/データschema/主要操作/保存復元/エラー/QA/納品ファイル',site:'サイトマップ/セクション設計/コピー/CTA/レスポンシブ/SEO基本/公開前QA',visual:'用途・比率/DESIGN BIBLE/構図/正確な文字/画像生成/文字修正/完成画像',slides:'ストーリー/各ページ主張/図表/話者意図/デザインルール/完成資料',document:'目的/構造/本文/表・注記/事実境界/編集QA/完成文書',sheet:'入力列/計算列/数式/検証/書式/グラフ/境界値QA/完成表',sns:'媒体/投稿目的/Hook/本文/ビジュアル/CTA/投稿順/完成素材',manga:'形式選択/Bible/ネーム/コマまたは縦スクロール/Lettering Map/画像/文字修正/QA',education:'学習目標/構成/問題/Answer Ledger/解答解説/図表照合/採点/完成教材',research:'調査設計/ソース/比較軸/分析/反証/示唆/完成レポート',automation:'trigger/condition/action/権限/例外/retry/停止/テスト',manual:'読者/前提/手順/期待結果/失敗時/図解/FAQ/完成版'};
function compile(k){const q=$('#quality').value;let depth=q==='max'?`# DEEP PROMPT COMPILER — QUALITY MAX\n必要なMUST/失敗防止/QAを長さ都合で削除しない。内部で Requirement Lock→Design→Production→Failure Prevention→QA→Delivery の順に処理し、思考過程ではなく完成物と必要な判断を返す。`:q==='standard'?`# STANDARD MODE\n重複説明は圧縮してよいが、MUST/制作工程/QA/納品条件は残す。`:`# LIGHT MODE\n背景説明は短縮するが、MUST/完成条件/重大な失敗防止は削らない。`;let visual=['visual','slides','sns','manga','education','manual'].includes(k)?'\n\n'+VIS:'';return `${depth}\n\n${master()}\n\n# TARGET OUTPUT\n成果物：${OUT[k][1]}\n想定制作先：${OUT[k][2]}\n制作工程：${PROD[k]}\n\n${E[k]}${visual}\n\n${GLOBAL}\n\n# OUTPUT ORDER — COMPLETE, NO OMISSION\n1. 制作方針と完成条件（短く）\n2. 構成/画面/ページ/データ設計\n3. 必要な設定表・Bible・Ledger\n4. 実制作（可能なら成果物/ファイルまで）\n5. 成果物専用QAと修正\n6. 完成物 / 実ファイル / 次工程へそのまま渡せる最終指示\n\n質問待ちで停止せず、安全な仮定で進める。ただし確認必須の事実は捏造しない。TODOや「以下略」で省略しない。`;}

const Voice={r:null,target:null,mode:'',keep:false,stop:false,seg:[],last:'',timer:null,start:0};const norm=s=>String(s||'').replace(/\s+/g,'').replace(/[、。,.!?！？]/g,'');function ui(id,mode){Voice.target=document.getElementById(id);Voice.mode=mode;Voice.keep=true;Voice.stop=false;Voice.seg=[];Voice.last='';Voice.start=Date.now();$('#voice').hidden=false;clearInterval(Voice.timer);Voice.timer=setInterval(()=>{let s=Math.floor((Date.now()-Voice.start)/1000);$('#time').textContent=`${String(s/60|0).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000)}function done(t){if(t&&Voice.target)Voice.target.value+=(Voice.target.value?'\n':'')+t.trim();clearInterval(Voice.timer);$('#voice').hidden=true;Voice.r=null;Voice.target=null;Voice.mode='';Voice.keep=false;Voice.seg=[]}window.AISeisakuNativeVoice={onReady(){if(Voice.mode==='native')$('#preview').textContent='話してください…'},onPartial(t){if(Voice.mode==='native')$('#preview').textContent=t||'話してください…'},onCommitted(t){if(Voice.mode==='native')$('#preview').textContent=t||'認識中…'},onFinalText(t){if(Voice.mode==='native'){done(t);toast('音声を入力しました')}},onError(t){if(Voice.mode==='native'){done('');toast(t||'音声認識エラー')}}};function startVoice(id){stopVoice(true);if(window.NativeVoice&&typeof window.NativeVoice.start==='function'){ui(id,'native');$('#preview').textContent='Android音声認識を準備中…';try{window.NativeVoice.start(id)}catch{done('');toast('音声認識を開始できませんでした')}return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('この環境では音声認識非対応です。Androidアプリ版またはキーボード音声入力を利用してください');ui(id,'web');let r=Voice.r=new SR;r.lang='ja-JP';r.continuous=true;r.interimResults=true;r.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal){let n=norm(t);if(n&&n!==Voice.last){Voice.seg.push(t.trim());Voice.last=n}}else it+=t}$('#preview').textContent=it||Voice.seg.slice(-2).join(' ')||'話してください…'};r.onend=()=>{if(Voice.keep&&!Voice.stop)setTimeout(()=>{try{r.start()}catch{}},250);else done(Voice.seg.join(' '))};r.onerror=e=>{if(['not-allowed','service-not-allowed'].includes(e.error)){Voice.keep=false;toast('マイク権限を確認してください')}};try{r.start()}catch{done('');toast('音声認識を開始できませんでした')}}function stopVoice(silent=false){if(Voice.mode==='native'&&window.NativeVoice){Voice.keep=false;Voice.stop=true;try{window.NativeVoice.stop()}catch{done('')}return}if(Voice.r){Voice.keep=false;Voice.stop=true;try{Voice.r.stop()}catch{done(Voice.seg.join(' '))}}else if(!silent)$('#voice').hidden=true}$$('[data-voice]').forEach(b=>b.onclick=e=>{e.preventDefault();startVoice(b.dataset.voice)});$('#stop').onclick=()=>stopVoice();
})();
