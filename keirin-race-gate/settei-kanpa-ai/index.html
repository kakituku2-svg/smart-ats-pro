<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f8fc">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>設定看破AI v4.2</title>
  <style>
    *{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:linear-gradient(180deg,#fbfdff,#eef4f8);color:#172331;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;padding:18px}.box{width:min(430px,100%);padding:24px;border:1px solid #d7e2ea;border-radius:22px;background:#fff;box-shadow:0 14px 40px rgba(35,56,78,.12)}.brand{font-size:23px;font-weight:950;letter-spacing:.02em}.accent{color:#087ea4}.small{color:#657487;font-size:13px;line-height:1.7;margin:10px 0 0}.bar{height:5px;margin-top:20px;border-radius:999px;background:#e7eef4;overflow:hidden}.bar:after{content:"";display:block;height:100%;width:42%;border-radius:inherit;background:linear-gradient(90deg,#1793bb,#25a77d);animation:load 1.05s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}.tip{margin-top:14px;padding:10px 12px;border-radius:13px;background:#eef8fb;border:1px solid #cbe3ec;color:#356173;font-size:11px;line-height:1.5}
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">設定看破AI <span class="accent">v4.2</span></div>
    <p class="small" id="status">HALL VISIBILITY を読み込んでいます…</p>
    <div class="bar" id="bar"></div>
    <div class="tip">iPhoneではSafariで開き、共有 →「ホーム画面に追加」でアプリのように使えます。</div>
  </div>
  <script>
  (async()=>{try{
    if(!('DecompressionStream' in window)) throw new Error('このSafariでは展開機能が利用できません。iOS / Safariを最新版に更新して再度開いてください。');
    const files=[1,2,3,4,5,6].map(n=>`./app-v4.2.part${n}.txt?v=4.2.0`);
    const parts=await Promise.all(files.map(async u=>{
      const res=await fetch(u,{cache:'no-cache'});
      if(!res.ok) throw new Error('アプリ本体を取得できませんでした。');
      return (await res.text()).trim();
    }));
    const b64=parts.join('');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('bar').style.display='none';
    document.getElementById('status').textContent=e && e.message ? e.message : '読み込みに失敗しました。';
  }})();
  </script>
</body>
</html>
