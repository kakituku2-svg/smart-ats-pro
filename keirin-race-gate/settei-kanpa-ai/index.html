<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8fc"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><title>設定看破AI v4.4</title><style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:linear-gradient(180deg,#fbfdff,#eef4f8);color:#172331;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh;padding:18px}.box{width:min(430px,100%);padding:24px;border:1px solid #d7e2ea;border-radius:22px;background:#fff;box-shadow:0 14px 40px rgba(35,56,78,.12)}.brand{font-size:23px;font-weight:950}.accent{color:#087ea4}.small{color:#657487;font-size:13px;line-height:1.7;margin:10px 0 0}.bar{height:5px;margin-top:20px;border-radius:999px;background:#e7eef4;overflow:hidden}.bar:after{content:"";display:block;height:100%;width:42%;border-radius:inherit;background:#087ea4;animation:load 1.05s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}.tip{margin-top:14px;padding:10px 12px;border-radius:13px;background:#eef8fb;border:1px solid #cbe3ec;color:#356173;font-size:11px}</style></head><body><div class="box"><p class="small" id="status">読み込み中…</p><div class="bar" id="bar"></div></div><script>(async()=>{try{if(!('DecompressionStream' in window))throw new Error('iOS / Safariを最新版に更新してください。');const files=['./app-v4.2.part1.txt','./app-v4.2.part2.txt','./app-v4.2.part3.txt','./app-v4.2.part4.txt','./app-v4.2.part5.txt','./app-v4.2.part6a.txt','./app-v4.2.part6b.txt','./app-v4.2.part6c.txt','./app-v4.2.part6d.txt'].map(u=>u+'?v=4.4.0');const parts=await Promise.all(files.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('アプリ本体を取得できませんでした。');return(await r.text()).trim()}));const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replaceAll('v4.2','v4.4').replaceAll('ATSUDai-4.2','ATSUDai-4.4');const css=`<style>.bottom-nav{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:4px!important;max-width:540px!important;padding:5px!important}.bottom-nav .tab{min-width:0!important;min-height:52px!important;padding:5px 2px!important;gap:3px!important}.bottom-nav .tab span:last-child{font-size:8.5px!important;white-space:nowrap!important}.v43-more-back{position:fixed;z-index:95;inset:0;background:rgba(23,38,52,.24);backdrop-filter:blur(3px);display:none}.v43-more-back.open{display:block}.v43-more-sheet{position:fixed;z-index:96;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);background:#fff;border:1px solid #d4dee7;border-radius:24px 24px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -14px 42px rgba(39,59,79,.20);transition:transform .2s}.v43-more-sheet.open{transform:translate(-50%,0)}.v43-more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.v43-more-action{border:1px solid #d8e2ea;background:#f7fafc;color:#2d4357;border-radius:15px;min-height:72px;font-weight:900}.v43-more-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;color:#1d2f42}.v43-close{border:1px solid #d5e0e8;background:#f7fafc;color:#44586b;border-radius:11px;width:36px;height:36px;font-weight:900}.top,.quick-strip{display:none!important}.wrap{padding-top:max(6px,env(safe-area-inset-top))!important}.form{top:8px!important;padding:13px 14px 15px!important}.form>.section-title{font-size:9px!important;letter-spacing:.08em!important;margin:0 0 3px!important;color:#7890a3!important}.v44-mode-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px}.v44-mode-row .mode-title{font-size:19px!important;line-height:1.2!important;margin:0!important;letter-spacing:-.025em!important}.v44-info-btn{flex:0 0 30px;width:30px;height:30px;border-radius:10px;border:1px solid #cbd9e4;background:#f7fafc;color:#587084;font-weight:950;font-size:13px;padding:0}.mode-note{display:none!important;margin:0 0 9px!important;padding:8px 10px!important;border-radius:10px!important;background:#f7fafc!important;border:1px solid #dfe8ef!important;color:#64788b!important;font-size:11px!important;line-height:1.45!important}.mode-note.v44-open{display:block!important}.form .field{margin:9px 0!important;gap:5px!important}.form .field label{font-size:10px!important}.form .field input,.form .field select,.form .field textarea{min-height:46px!important;padding:11px 13px!important;border-radius:12px!important}.form .chips{gap:6px!important}.form .chip{padding:8px 10px!important;border-radius:11px!important;font-size:10px!important}.form .primary{min-height:49px!important;margin-top:10px!important;border-radius:13px!important}@media(max-width:540px){.wrap{padding-left:8px!important;padding-right:8px!important;padding-top:max(5px,env(safe-area-inset-top))!important;padding-bottom:84px!important}.bottom-nav{width:calc(100% - 10px)!important;bottom:max(4px,env(safe-area-inset-bottom))!important;border-radius:19px!important}.bottom-nav .tab{min-height:50px!important;border-radius:14px!important}.nav-icon{font-size:15px!important}.grid{gap:8px!important}.card{border-radius:17px!important}.form{padding:12px 13px 14px!important}.v44-mode-row{margin-bottom:5px!important}.v44-mode-row .mode-title{font-size:18px!important}.form>.section-title{margin-bottom:2px!important}}</style>`;const js=`<script>(()=>{try{const nav=document.querySelector('.bottom-nav');if(!nav)return;const all=[...nav.querySelectorAll('.tab[data-mode]')],by=m=>all.find(b=>b.dataset.mode===m),area=by('area'),store=by('store'),event=by('event'),live=by('live'),ledger=by('ledger'),counter=by('counter');if(!(area&&store&&event&&live&&ledger&&counter))return;area.querySelector('span:last-child').textContent='ホーム';store.querySelector('span:last-child').textContent='店比較';nav.appendChild(live);[event,ledger,counter].forEach(b=>b.style.display='none');const hist=document.createElement('button');hist.className='tab';hist.type='button';hist.innerHTML='<span class="nav-icon">▤</span><span>履歴</span>';const more=document.createElement('button');more.className='tab';more.type='button';more.innerHTML='<span class="nav-icon">•••</span><span>その他</span>';nav.append(hist,more);const back=document.createElement('div');back.className='v43-more-back';const sheet=document.createElement('section');sheet.className='v43-more-sheet';sheet.innerHTML='<div class="v43-more-title"><b>その他の機能</b><button type="button" class="v43-close">×</button></div><div class="v43-more-grid"><button type="button" class="v43-more-action" data-go="event">≋<br>イベント・癖</button><button type="button" class="v43-more-action" data-go="ledger">▦<br>収支</button><button type="button" class="v43-more-action" data-go="counter">＋1<br>小役</button><button type="button" class="v43-more-action v44-display-action">☀<br>表示</button></div>';document.body.append(back,sheet);const close=()=>{back.classList.remove('open');sheet.classList.remove('open')};more.addEventListener('click',()=>{back.classList.add('open');sheet.classList.add('open')});back.addEventListener('click',close);sheet.querySelector('.v43-close').addEventListener('click',close);sheet.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{const t=by(b.dataset.go);if(t)t.click();close();setTimeout(()=>{[area,store,live,hist].forEach(x=>x.classList.remove('active'));more.classList.add('active')},0)}));[area,store,live].forEach(b=>b.addEventListener('click',()=>{hist.classList.remove('active');more.classList.remove('active')}));hist.addEventListener('click',()=>{area.click();setTimeout(()=>{area.classList.remove('active');more.classList.remove('active');hist.classList.add('active');document.querySelector('.hist')?.scrollIntoView({behavior:'smooth',block:'start'})},0)});const title=document.getElementById('modeTitle'),note=document.getElementById('modeNote');if(title&&note){const row=document.createElement('div');row.className='v44-mode-row';title.parentNode.insertBefore(row,title);row.appendChild(title);const q=document.createElement('button');q.type='button';q.className='v44-info-btn';q.textContent='?';row.appendChild(q);q.addEventListener('click',()=>{note.classList.toggle('v44-open');q.textContent=note.classList.contains('v44-open')?'×':'?'})}const vis=document.getElementById('visibilityBtn'),vb=sheet.querySelector('.v44-display-action');if(vis&&vb)vb.addEventListener('click',()=>vis.click());document.title='設定看破AI v4.4 — COMPACT TOP';document.querySelectorAll('.version-pill').forEach(x=>x.textContent='v4.4')}catch(e){console.error(e)}})();<\/script>`;html=html.replace('</head>',css+'</head>').replace('</body>',js+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('bar').style.display='none';document.getElementById('status').textContent=e?.message||'読み込みに失敗しました。'}})();</script></body></html>
