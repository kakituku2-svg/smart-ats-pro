ight:36px;border:1px solid #d5e0e8;background:#f7fafc;border-radius:11px}.hs-mode{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 5px}.hs-mode .mode-title{font-size:18px!important;margin:0!important}.hs-info{width:30px;height:30px;border:1px solid #cbd9e4;background:#f7fafc;border-radius:10px}.mode-note{display:none!important}.mode-note.hs-open{display:block!important;margin:0 0 9px!important;padding:8px 10px!important;background:#f7fafc!important;border:1px solid #dfe8ef!important;border-radius:10px!important;font-size:11px!important}@media(max-width:540px){.wrap{padding-left:8px!important;padding-right:8px!important}.bottom-nav{width:calc(100% - 10px)!important;bottom:max(4px,env(safe-area-inset-bottom))!important}}</style>`;const js=`<script>(()=>{try{const nav=document.querySelector('.bottom-nav');if(!nav)return;const all=[...nav.querySelectorAll('.tab[data-mode]')],by=m=>all.find(b=>b.dataset.mode===m),area=by('area'),store=by('store'),event=by('event'),live=by('live'),ledger=by('ledger'),counter=by('counter');if(!(area&&store&&event&&live&&ledger&&counter))return;area.querySelector('span:last-child').textContent='ホーム';store.querySelector('span:last-child').textContent='店比較';nav.appendChild(live);[event,ledger,counter].forEach(b=>b.style.display='none');const hist=document.createElement('button');hist.className='tab';hist.type='button';hist.innerHTML='<span class="nav-icon">▤</span><span>履歴</span>';const more=document.createElement('button');more.className='tab';more.type='button';more.innerHTML='<span class="nav-icon">•••</span><span>その他</span>';nav.append(hist,more);const back=document.createElement('div');back.className='hs-back';const sheet=document.createElement('section');sheet.className='hs-sheet';sheet.innerHTML='<div class="hs-title"><b>その他の機能</b><button class="hs-close">×</button></div><div class="hs-grid"><button class="hs-act" data-go="event">≋<br>イベント・癖</button><button class="hs-act" data-go="ledger">▦<br>収支</button><button class="hs-act" data-go="counter">＋1<br>小役</button><button class="hs-act" id="hsDisplay">☀<br>表示</button></div>';document.body.append(back,sheet);const close=()=>{back.classList.remove('open');sheet.classList.remove('open')};more.onclick=()=>{back.classList.add('open');sheet.classList.add('open')};back.onclick=close;sheet.querySelector('.hs-close').onclick=close;sheet.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{by(b.dataset.go)?.click();close();setTimeout(()=>{[area,store,live,hist].forEach(x=>x.classList.remove('active'));more.classList.add('active')},0)});[area,store,live].forEach(b=>b.addEventListener('click',()=>{hist.classList.remove('active');more.classList.remove('active')}));hist.onclick=()=>{area.click();setTimeout(()=>{area.classList.remove('active');more.classList.remove('active');hist.classList.add('active');document.querySelector('.hist')?.scrollIntoView({behavior:'smooth',block:'start'})},0)};const t=document.getElementById('modeTitle'),n=document.getElementById('modeNote');if(t&&n){const r=document.createElement('div');r.className='hs-mode';t.parentNode.insertBefore(r,t);r.append(t);const q=document.createElement('button');q.className='hs-info';q.textContent='?';r.append(q);q.onclick=()=>{n.classList.toggle('hs-open');q.textContent=n.classList.contains('hs-open')?'×':'?'}}const vis=document.getElementById('visibilityBtn');if(vis)document.getElementById('hsDisplay').onclick=()=>vis.click();document.title='HALL SCOPE v4.5 — HALL INTELLIGENCE';document.querySelectorAll('.version-pill').forEach(x=>x.textContent='v4.5');const foot=document.querySelector('.foot');if(foot)foot.textContent=foot.textContent.replace('HALL VISIBILITY','HALL INTELLIGENCE')}catch(e){console.error(e)}})();<\/script>`;h=h.replace('</head>',css+'</head>').replace('</body>',js+'</body>');document.open();document.write(h);document.close()}catch(e){document.getElementById('bar').style.display='none';document.getElementById('status').textContent=e?.message||'読み込みに失敗しま
