<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <title>設定看破AI v4.1</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090d14;color:#e7edf5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}.box{width:min(430px,100%);padding:22px;border:1px solid #233042;border-radius:20px;background:#111722;box-shadow:0 22px 70px #0008}.brand{font-size:22px;font-weight:900;letter-spacing:.04em}.accent{background:linear-gradient(90deg,#8beaff,#6fe7be,#e8c979);-webkit-background-clip:text;background-clip:text;color:transparent}.small{color:#8fa0b5;font-size:12px;line-height:1.7;margin:10px 0 0}.bar{height:4px;margin-top:18px;border-radius:999px;background:#1b2533;overflow:hidden}.bar:after{content:"";display:block;height:100%;width:42%;border-radius:inherit;background:linear-gradient(90deg,#8beaff,#6fe7be);animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">設定看破AI <span class="accent">v4.1</span></div>
    <p class="small" id="status">STORE INTELLIGENCE を読み込んでいます…</p>
    <div class="bar" id="bar"></div>
  </div>
  <script>
  (async()=>{try{
    if(!('DecompressionStream' in window)) throw new Error('このブラウザは圧縮アプリの展開に対応していません。最新版のChrome / Safariで開いてください。');
    const res=await fetch('./app.html.gz.b64',{cache:'no-cache'});
    if(!res.ok) throw new Error('アプリ本体を取得できませんでした。');
    const b64=(await res.text()).trim();
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('bar').style.display='none';
    document.getElementById('status').textContent=e && e.message ? e.message : '読み込みに失敗しました。';
  }})();
  </script>
</body>
</html>
