<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f8fc"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><title>設定看破AI v4.3</title><style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:linear-gradient(180deg,#fbfdff,#eef4f8);color:#172331;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh;padding:18px}.box{width:min(430px,100%);padding:24px;border:1px solid #d7e2ea;border-radius:22px;background:#fff;box-shadow:0 14px 40px rgba(35,56,78,.12)}.brand{font-size:23px;font-weight:950}.accent{color:#087ea4}.small{color:#657487;font-size:13px;line-height:1.7;margin:10px 0 0}.bar{height:5px;margin-top:20px;border-radius:999px;background:#e7eef4;overflow:hidden}.bar:after{content:"";display:block;height:100%;width:42%;border-radius:inherit;background:#087ea4;animation:load 1.05s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(135%)}}.tip{margin-top:14px;padding:10px 12px;border-radius:13px;background:#eef8fb;border:1px solid #cbe3ec;color:#356173;font-size:11px}</style></head><body><div class="box"><div class="brand">設定看破AI <span class="accent">v4.3</span></div><p class="small" id="status">ONE BAR UI を読み込んでいます…</p><div class="bar" id="bar"></div><div class="tip">iPhoneではSafariで開き、共有 →「ホーム画面に追加」で使えます。</div></div><script>(async()=>{try{if(!('DecompressionStream' in window))throw new Error('iOS / Safariを最新版に更新してください。');const files=['./app-v4.2.part1.txt','./app-v4.2.part2.txt','./app-v4.2.part3.txt','./app-v4.2.part4.txt','./app-v4.2.part5.txt','./app-v4.2.part6a.txt','./app-v4.2.part6b.txt','./app-v4.2.part6c.txt','./app-v4.2.part6d.txt'].map(u=>u+'?v=4.3.0');const parts=await Promise.all(files.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('アプリ本体を取得できませんでした。');return(await r.text()).trim()}));const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));let html=await new Response(stream).text();html=html.replaceAll('v4.2','v4.3').replaceAll('ATSUDai-4.2','ATSUDai-4.3');const css=`<style>.bottom-nav{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:4px!important;max-width:540px!important;padding:5px!important}.bottom-nav .tab{min-width:0!important;min-height:52px!important;padding:5px 2px!important;gap:3px!important}.bottom-nav .tab span:last-child{font-size:8.5px!important;white-space:nowrap!important}.v43-more-back{position:fixed;z-index:95;inset:0;background:rgba(23,38,52,.24);backdrop-filter:blur(3px);display:none}.v43-more-back.open{display:block}.v43-more-sheet{position:fixed;z-index:96;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);background:#fff;border:1px solid #d4dee7;border-radius:24px 24px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -14px 42px rgba(39,59,79,.20);transition:transform .2s}.v43-more-sheet.open{transform:translate(-50%,0)}.v43-more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.v43-more-action{border:1px solid #d8e2ea;background:#f7fafc;color:#2d4357;border-radius:15px;min-height:82px;font-weight:900}.v43-more-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;color:#1d2f42}.v43-close{border:1px solid #d5e0e8;background:#f7fafc;color:#44586b;border-radius:11px;width:36px;height:36px;font-weight:900}@media(max-width:540px){.wrap{padding-bottom:84px!important}.bottom-nav{width:calc(100% - 10px)!important;bottom:max(4px,env(safe-area-inset-bottom))!important;border-radius:19px!important}.bottom-nav .tab{min-height:50px!important;border-radius:14px!important}.nav-icon{font-size:15px!important}}</style>`;const js=`<script>(()=>{try{const nav=document.querySelector('.bottom-nav');if(!nav)return;const all=[...nav.querySelectorAll('.tab[data-mode]')],by=m=>all.find(b=>b.dataset.mode===m),area=by('area'),store=by('store'),event=by('event'),live=by('live'),ledger=by('ledger'),counter=by('counter');if(!(area&&store&&event&&live&&ledger&&counter))return;area.querySelector('span:last-child').textContent='ホーム';store.querySelector('span:last-child').textContent='店比較';nav.appendChild(live);[event,ledger,counter].forEach(b=>b.style.display='none');const hist=document.createElement('button');hist.className='tab';hist.type='button';hist.innerHTML='<span class="nav-icon">▤</span><span>履歴</span>';const more=document.createElement('button');more.className='tab';more.type='button';more.innerHTML='<span class="nav-icon">•••</span><span>その他</span>';nav.append(hist,more);const back=document.createElement('div');back.className='v43-more-back';const sheet=document.createElement('section');sheet.className='v43-more-sheet';sheet.innerHTML='<div class="v43-more-title"><b>その他の機能</b><button type="button" class="v43-close">×</button></div><div class="v43-more-grid"><button type="button" class="v43-more-action" data-go="event">≋<br>イベント・癖</button><button type="button" class="v43-more-action" data-go="ledger">▦<br>収支</button><button type="button" class="v43-more-action" data-go="counter">＋1<br>小役</button></div>';document.body.append(back,sheet);const close=()=>{back.classList.remove('open');sheet.classList.remove('open')};more.addEventListener('click',()=>{back.classList.add('open');sheet.classList.add('open')});back.addEventListener('click',close);sheet.querySelector('.v43-close').addEventListener('click',close);sheet.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{const t=by(b.dataset.go);if(t)t.click();close();setTimeout(()=>{[area,store,live,hist].forEach(x=>x.classList.remove('active'));more.classList.add('active')},0)}));[area,store,live].forEach(b=>b.addEventListener('click',()=>{hist.classList.remove('active');more.classList.remove('active')}));hist.addEventListener('click',()=>{area.click();setTimeout(()=>{area.classList.remove('active');more.classList.remove('active');hist.classList.add('active');document.querySelector('.hist')?.scrollIntoView({behavior:'smooth',block:'start'})},0)});document.title='設定看破AI v4.3 — ONE BAR';document.querySelectorAll('.version-pill').forEach(x=>x.textContent='v4.3')}catch(e){console.error(e)}})();<\/script>`;html=html.replace('</head>',css+'</head>').replace('</body>',js+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('bar').style.display='none';document.getElementById('status').textContent=e?.message||'読み込みに失敗しました。'}})();</script></body></html>
