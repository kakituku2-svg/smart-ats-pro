</style></head><body><div class="wrap">
<header class="top"><div><div class="sub">漫画 → TikTok動画</div><h1>Manga2Tok</h1></div><button id="install" class="btn ghost" hidden>インストール</button></header>
<section class="card"><div class="head"><span class="n">1</span><div><h2>漫画画像を選ぶ</h2><div class="muted">3〜10枚をまとめて選ぶだけ。数字順に自動整列。</div></div></div><label class="btn primary full pick">画像を選ぶ<input id="files" type="file" accept="image/*" multiple hidden></label><div id="ih" class="install">Android: Chromeメニュー → アプリをインストール</div></section>
<section id="edit" class="card" hidden><div class="head"><span class="n">2</span><h2>順番を確認</h2><span id="count" class="pill"></span></div><div class="fields"><label><span>タイトル</span><input id="title" value="新しい漫画動画"></label><label><span>話数</span><input id="ep" type="number" min="1" value="1"></label></div><div id="grid" class="grid"></div><details><summary>詳細設定</summary><div class="settings"><label><span>画質</span><select id="res"><option value="1080">1080×1920 高画質</option><option value="720">720×1280 高速</option></select></label><label><span>モーション</span><select id="motion"><option value="1">軽いズーム</option><option value="0">なし</option></select></label><label><span>切替</span><select id="fade"><option value="1">0.25秒フェード</option><option value="0">カット</option></select></label></div></details><div class="stats"><div><b id="dur">—</b><small>動画尺</small></div><div><b>9:16</b><small>縦動画</small></div><div><b>MP4</b><small>H.264</small></div></div><button id="make" class="btn primary full">動画を作る</button></section>
<section id="prog" class="card" hidden><div class="head"><span class="n">3</span><h2>生成中</h2><span id="pct" class="pill">0%</span></div><div class="progress"><div id="bar" class="bar"></div></div><p id="status" class="muted">準備中…</p><button id="cancel" class="btn ghost">中止</button></section>
<section id="done" class="card" hidden><div class="head"><span class="n ok">✓</span><h2>完成</h2><span id="meta" class="pill">MP4</span></div><video id="video" controls playsinline></video><div class="actions"><a id="dl" class="btn primary" download>MP4を保存</a><button id="share" class="btn">共有する</button></div><p class="muted">TikTokでこのMP4を選び、投稿画面でBGMを追加してください。</p></section>
<section class="card"><details><summary>保存済み・バックアップ</summary><div class="settings"><input id="search" type="search" placeholder="タイトルで検索"><button id="save" class="btn">現在を保存</button><button id="backup" class="btn ghost">バックアップ</button><label class="btn ghost">復元<input id="restore" type="file" accept=".json,application/json" hidden></label></div><div id="saved" class="saved"></div></details></section>
<footer><span>画像は端末内で処理</span><span>v1.0.0</span></footer><canvas id="c" hidden></canvas></div>
<script type="module">
const M='https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/+esm',FPS=30,MIN=3,MAX=10,DB='m2t',ST='projects',q=s=>document.querySelector(s);

let S={id:crypto.randomUUID(),title:'新しい漫画動画',ep:1,imgs:[],blob:null,url:null,abort:false},defer=null,dbp;

E.files.onchange=e=>{let fs=nat(e.target.files).slice(0,MAX);S.imgs.forEach(x=>URL.revokeObjectURL(x.url));S.imgs=fs.map(f=>({id:crypto.randomUUID(),name:f.name,blob:f,url:URL.createObjectURL(f)}));if(e.target.files.length>MAX)alert('最大10枚です。先頭10枚を読み込みました。');render();autosave();e.target.value=''};

async function codec(w,h){let base={width:w,height:h,bitrate:w>900?5000000:2500000,framerate:FPS,latencyMode:'quality'};for(let c of ['avc1.42E028','avc1.4D4028','avc1.640028'])try{let r=await VideoEncoder.isConfigSupported({...base,codec:c,avc:{format:'avc'}});if(r.supported)return r.config}catch{}return null}
function prog(p,t){p=Math.max(0,Math.min(100,Math.round(p)));E.bar.style.width=p+'%';E.pct.textContent=p+'%';E.status.textContent=t}
E.make.onclick=async()=>{if(S.imgs.length<MIN)return;if(!window.VideoEncoder||!window.VideoFrame){alert('Chrome最新版で開いてください。');return}S.abort=false;E.prog.hidden=false;E.done.hidden=true;prog(1,'動画エンジンを準備中…');E.prog.scrollIntoView({behavior:'smooth'});let w=E.res.value=='1080'?1080:720,h=E.res.value=='1080'?1920:1280,cfg=await codec(w,h);if(!cfg){E.status.textContent='H.264非対応です。720pまたはChrome最新版を試してください。';return}let Mod;try{Mod=await import(M)}catch(err){E.status.textContent='動画部品を読み込めません。通信を確認してください。';return}let bs=[];try{for(let x of S.imgs)bs.push(await createImageBitmap(x.blob))}catch(err){E.status.textContent='画像を読み込めません。';return}let target=new Mod.ArrayBufferTarget(),mux=new Mod.Muxer({target,video:{codec:'avc',width:w,height:h},fastStart:'in-memory'}),encErr=null,enc=new VideoEncoder({output:(ch,me)=>mux.addVideoChunk(ch,me),error:e=>encErr=e});enc.configure(cfg);let cv=E.c;cv.width=w;cv.height=h;let cx=cv.getContext('2d',{alpha:false}),ds=durs(bs.length),st=[],a=0;for(let d of ds){st.push(a);a+=d}let frames=Math.round(a*FPS),pg=0,m=E.motion.value=='1',fade=E.fade.value=='1';try{for(let f=0;f<frames;f++){if(S.abort)throw new DOMException('中止','AbortError');let t=f/FPS;while(pg<ds.length-1&&t>=st[pg]+ds[pg])pg++;let loc=t-st[pg],du=ds[pg],p=Math.max(0,Math.min(1,loc/du));cx.fillStyle='#000';cx.fillRect(0,0,w,h);if(fade&&pg<bs.length-1&&du-loc<=.25){let r=1-(du-loc)/.25;draw(cx,bs[pg],w,h,p,m,1-r);draw(cx,bs[pg+1],w,h,0,m,r)}else draw(cx,bs[pg],w,h,p,m);let vf=new VideoFrame(cv,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});enc.encode(vf,{keyFrame:f%(FPS*2)==0});vf.close();if(f%60==0){await new Promise(r=>setTimeout(r,0));prog(5+(f/frames)*88,'生成中… '+(pg+1)+'/'+bs.length+'ページ')}if(enc.encodeQueueSize>8)await enc.flush();if(encErr)throw encErr}prog(95,'MP4を仕上げています…');await enc.flush();enc.close();mux.finalize()}catch(err){try{enc.close()}catch{}bs.forEach(b=>b.close());E.status.textContent=err.name=='AbortError'?'中止しました':'生成失敗: '+(err.message||err);return}bs.forEach(b=>b.close());S.blob=new Blob([target.buffer],{type:'video/mp4'});if(S.url)URL.revokeObjectURL(S.url);S.url=URL.createObjectURL(S.blob);E.video.src=S.url;E.dl.href=S.url;E.dl.download=fname();E.meta.textContent=(S.blob.size/1048576).toFixed(1)+'MB · '+a.toFixed(a%1?1:0)+'秒';E.done.hidden=false;prog(100,'完成');E.done.scrollIntoView({behavior:'smooth'});save()};
E.cancel.onclick=()=>S.abort=true;E.share.onclick=async()=>{if(!S.blob)return;let f=new File([S.blob],fname(),{type:'video/mp4'});try{if(navigator.share&&navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:S.title});else E.dl.click()}catch(e){}};
const openDB=()=>dbp||(dbp=new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
